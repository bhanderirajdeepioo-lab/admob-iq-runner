# One-off: compare GA4 report shapes for app_remove on old vs recent days (see admob_iq/fetch/ga4_diagnose.py).
# Input + output live in the PRIVATE repo (ga4/diagnose_input.json → ga4/diagnose.json). Public log: counts only.
name: ga4-diagnose

on:
  workflow_dispatch:

permissions:
  contents: read                 # this repo is never written to

concurrency:
  group: ga4-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -q -r requirements.txt pynacl
      - name: Run
        env:
          GA4_REFRESH_TOKENS: ${{ secrets.GA4_REFRESH_TOKENS }}
          GA4_REFRESH_TOKEN: ${{ secrets.GA4_REFRESH_TOKEN }}
          GA4_CLIENT_ID: ${{ secrets.GA4_CLIENT_ID }}
          GA4_CLIENT_SECRET: ${{ secrets.GA4_CLIENT_SECRET }}
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: python -m admob_iq.fetch.ga4_diagnose 2>/tmp/diag.err || { echo "::error::diagnose failed (details kept off the public log)"; exit 1; }
