name: AdMob IQ — refresh (public runner)

# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS REPO IS PUBLIC
# GitHub gives PUBLIC repos unlimited free Actions minutes; a private repo only
# gets 2,000 min/month. So this repo holds ONLY CODE. It clones the PRIVATE data
# repo, refreshes the AdMob + Google Ads data, and pushes the results back there.
#
# NO revenue data is ever stored in this public repo:
#   * data/ and site/ are .gitignore'd here, and this job runs with contents: read
#     so it could not commit them even if it tried
#   * this workflow only ever pushes to the PRIVATE repo (DATA_REPO)
#   * build output is suppressed, because Actions logs on a public repository are
#     world-readable (see the "Build" step)
#   * no artifacts are uploaded
# Secrets are safe: GitHub never exposes secrets to forks or pull requests, and
# this workflow only runs on a schedule or a manual click by a repo admin.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Every 30 minutes. Minutes are free (public repo) and AdMob's reporting quota
    # is 900 reads/MINUTE — a run uses ~50 reads, so this is far inside it.
    # :07/:37 rather than :00/:30 because GitHub throttles scheduled runs hardest
    # on the hour and drops many of them.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Days of AdMob history to pull (35 = normal run)"
        required: false
        default: "35"

permissions:
  contents: read                 # this repo is never written to

concurrency:
  group: admob-iq-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # this repo = code only

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Pull data + config from the PRIVATE repo
        env:
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          test -n "$DATA_REPO"       || { echo "::error::DATA_REPO secret missing (format: owner/repo)"; exit 1; }
          test -n "$DATA_REPO_TOKEN" || { echo "::error::DATA_REPO_TOKEN secret missing"; exit 1; }
          git clone --depth=1 "https://x-access-token:$DATA_REPO_TOKEN@github.com/$DATA_REPO.git" _private \
            > /dev/null 2>/tmp/clone.err || { sed -E 's#//[^@]*@#//***@#g' /tmp/clone.err; echo "::error::could not clone the private data repo"; exit 1; }
          mkdir -p data site config
          cp -a _private/data/.   data/   2>/dev/null || true
          cp -a _private/site/.   site/   2>/dev/null || true
          cp -a _private/config/. config/ 2>/dev/null || true
          echo "pulled: $(ls -1 data 2>/dev/null | wc -l) data file(s)"

      - name: Build dashboard + send alerts
        env:
          FETCH_MODE: live
          ROLLING_REPULL_DAYS: ${{ github.event.inputs.backfill_days || '35' }}
          BACKFILL_DAYS: "365"
          REPORT_CURRENCY: "USD"
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ADMOB_ACCOUNTS_JSON:  ${{ secrets.ADMOB_ACCOUNTS_JSON }}
          GOOGLE_ADS_DEVELOPER_TOKEN:   ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_ADS_REFRESH_TOKEN:     ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CLIENT_ID:         ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET:     ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          NOTIFY_DRY_RUN:       ${{ vars.NOTIFY_DRY_RUN || 'true' }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST:            ${{ secrets.SMTP_HOST }}
          SMTP_PORT:            ${{ secrets.SMTP_PORT }}
          SMTP_USER:            ${{ secrets.SMTP_USER }}
          SMTP_PASS:            ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO:       ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          # PRIVACY: Actions logs on a PUBLIC repo are world-readable and the build prints
          # app ids and revenue totals. So its output goes to a file, never to the log. On
          # failure we show only the tail with long digit runs masked, which keeps the error
          # text readable ("OAuth fail", "PERMISSION_DENIED") while hiding ids and figures.
          if python -m admob_iq.build_static > /tmp/build.log 2>&1; then
            echo "build complete"
          else
            echo "::error::build failed — tail below, digits masked for privacy"
            # mask decimals FIRST (a revenue figure like 89.43 has no 4-digit run),
            # then any long digit run (publisher ids, app ids, counts).
            tail -n 30 /tmp/build.log | sed -E 's/[0-9]+\.[0-9]+/#.##/g; s/[0-9]{4,}/####/g'
            exit 1
          fi

      - name: Push refreshed data + site back to the PRIVATE repo
        run: |
          cp -f frontend/index.html site/index.html 2>/dev/null || true
          cd _private
          git config user.name  "admob-iq-bot"
          git config user.email "admob-iq-bot@users.noreply.github.com"
          # Race-proof: always rebuild on top of whatever is on the remote right now, then
          # push. Retry a few times in case another run lands in between.
          pushed=0
          for i in 1 2 3 4 5; do
            git fetch --depth=1 origin main > /dev/null 2>&1
            git reset --hard origin/main    > /dev/null 2>&1
            rm -rf data site && mkdir -p data site
            cp -a ../data/. data/ 2>/dev/null || true
            cp -a ../site/. site/ 2>/dev/null || true
            git add -A data site
            if git diff --cached --quiet; then echo "nothing to commit"; pushed=1; break; fi
            git commit -q -m "refresh $(date -u '+%F %H:%M') UTC"
            if git push -q origin HEAD:main 2>/dev/null; then echo "pushed on attempt $i"; pushed=1; break; fi
            echo "push attempt $i rejected — retrying on latest main"; sleep 5
          done
          [ "$pushed" = 1 ] || { echo "::error::push to the private repo failed after 5 attempts"; exit 1; }

      - name: Compact the private repo when it grows too big
        if: success()
        env:
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          MAX_REPO_MB: "2500"          # compact past this; GitHub warns around 5 GB
        run: |
          # Every run rewrites ~57 MB of .gz data files, so the private repo's git history
          # grows ~3 MB per run — at a 30-minute cadence that is ~4.7 GB/month. The HISTORY
          # of those files carries no information: each file already holds the full time
          # series. So once the repo passes MAX_REPO_MB we replace the history with a single
          # commit containing the exact same working tree. Every tracked file survives
          # (data, site, config, code, workflows) — only old git revisions are dropped.
          size_kb=$(curl -fsS -H "Authorization: Bearer $DATA_REPO_TOKEN" \
                         -H "Accept: application/vnd.github+json" \
                         "https://api.github.com/repos/$DATA_REPO" 2>/dev/null \
                    | python3 -c "import json,sys; print(int(json.load(sys.stdin).get('size') or 0))" 2>/dev/null || echo 0)
          echo "private repo: $((size_kb/1024)) MB (compact above ${MAX_REPO_MB} MB)"
          if [ "${size_kb:-0}" -le $((MAX_REPO_MB*1024)) ]; then echo "no compaction needed"; exit 0; fi
          cd _private
          # SAFETY: never force-push an empty or half-built tree over the real history.
          test -s site/dashboard.json      || { echo "::warning::dashboard.json missing — compaction skipped"; exit 0; }
          test -n "$(ls -A data 2>/dev/null)" || { echo "::warning::data/ is empty — compaction skipped"; exit 0; }
          git checkout -q --orphan _compact
          git add -A
          git -c user.name="admob-iq-bot" -c user.email="admob-iq-bot@users.noreply.github.com" \
              commit -q -m "compact history $(date -u '+%F') — same files, old git revisions dropped"
          if git push -q --force origin _compact:main 2>/dev/null; then
            echo "history compacted — repo back to roughly the size of one snapshot"
          else
            echo "::warning::compaction push failed — nothing lost, it will retry next run"
          fi
