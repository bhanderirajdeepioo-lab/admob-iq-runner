name: AdMob IQ — refresh (public runner)

# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS REPO IS PUBLIC
# GitHub gives PUBLIC repos unlimited free Actions minutes; a private repo only
# gets 2,000 min/month. So this repo holds ONLY CODE. It clones the PRIVATE data
# repo, refreshes the AdMob + Google Ads data, and pushes the results back there.
#
# NO revenue data is ever stored in this public repo:
#   * data/ and site/ are .gitignore'd here, and this job runs with contents: read
#     so it could not commit them even if it tried
#   * this workflow only ever pushes to the PRIVATE repo (DATA_REPO)
#   * build output is suppressed, because Actions logs on a public repository are
#     world-readable (see the "Build" step)
#   * no artifacts are uploaded
# Secrets are safe: GitHub never exposes secrets to forks or pull requests, and
# this workflow only runs on a schedule or a manual click by a repo admin.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Hourly. GitHub heavily throttles/drops public-repo scheduled runs, so a tighter
    # schedule isn't actually honoured (observed real gaps ran 55–156 min). Hourly keeps
    # AdMob far inside its 900 reads/MINUTE quota (~50 reads/run) AND preserves the hourly
    # deduction snapshots. :17 (not :00) dodges the top-of-hour peak GitHub throttles hardest.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Days of AdMob history to pull (35 = normal run)"
        required: false
        default: "35"
      lookback_days:
        description: "Per-app / new-account backfill probe cap in days (apps are auto-detected from their real start up to this cap; 1300 = ~3.5yr)"
        required: false
        default: "1300"

permissions:
  contents: read                 # this repo is never written to

concurrency:
  group: admob-iq-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # this repo = code only

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Pull data + config from the PRIVATE repo
        env:
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          test -n "$DATA_REPO"       || { echo "::error::DATA_REPO secret missing (format: owner/repo)"; exit 1; }
          test -n "$DATA_REPO_TOKEN" || { echo "::error::DATA_REPO_TOKEN secret missing"; exit 1; }
          git clone --depth=1 "https://x-access-token:$DATA_REPO_TOKEN@github.com/$DATA_REPO.git" _private \
            > /dev/null 2>/tmp/clone.err || { sed -E 's#//[^@]*@#//***@#g' /tmp/clone.err; echo "::error::could not clone the private data repo"; exit 1; }
          mkdir -p data site config
          cp -a _private/data/.   data/   2>/dev/null || true
          cp -a _private/site/.   site/   2>/dev/null || true
          cp -a _private/config/. config/ 2>/dev/null || true
          echo "pulled: $(ls -1 data 2>/dev/null | wc -l) data file(s)"

      - name: Build dashboard + send alerts
        env:
          FETCH_MODE: live
          ROLLING_REPULL_DAYS: ${{ github.event.inputs.backfill_days || '35' }}
          BACKFILL_DAYS: "365"
          AC_MAX_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '1300' }}
          REPORT_CURRENCY: "USD"
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ADMOB_ACCOUNTS_JSON:  ${{ secrets.ADMOB_ACCOUNTS_JSON }}
          GOOGLE_ADS_DEVELOPER_TOKEN:   ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_ADS_REFRESH_TOKEN:     ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CLIENT_ID:         ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET:     ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          NOTIFY_DRY_RUN:       ${{ vars.NOTIFY_DRY_RUN || 'true' }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST:            ${{ secrets.SMTP_HOST }}
          SMTP_PORT:            ${{ secrets.SMTP_PORT }}
          SMTP_USER:            ${{ secrets.SMTP_USER }}
          SMTP_PASS:            ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO:       ${{ secrets.ALERT_EMAIL_TO }}
          # GA4 (Uninstall tab) — fetched inside the build, at most once per ~20h per app; without these
          # the dashboard builds exactly as before. GA4_ENABLED=false (repo variable) switches it off.
          GA4_CLIENT_ID:        ${{ secrets.GA4_CLIENT_ID }}
          GA4_CLIENT_SECRET:    ${{ secrets.GA4_CLIENT_SECRET }}
          GA4_REFRESH_TOKENS:   ${{ secrets.GA4_REFRESH_TOKENS }}
          GA4_REFRESH_TOKEN:    ${{ secrets.GA4_REFRESH_TOKEN }}
          GA4_ENABLED:          ${{ vars.GA4_ENABLED || 'true' }}
          GA4_MIN_HOURS:        ${{ vars.GA4_MIN_HOURS || '20' }}
          # Active users tab (GA4): GA4_ACTIVE=false (repo variable) switches it off without a code push;
          # GA4_RETENTION_CHANGED = the day the GA4 data retention went to 14 months (empty: the config default)
          GA4_ACTIVE:           ${{ vars.GA4_ACTIVE || 'true' }}
          GA4_RETENTION_CHANGED: ${{ vars.GA4_RETENTION_CHANGED }}
          # Install value tab (GA4 + Ads): GA4_IDAY=true starts its install-day GA4 fetch (rollout step 1),
          # GA4_VALUE=true shows the tab (step 3, after the alert replay); VALUE_PAYBACK_DAYS = the owner's
          # "paisa kitne din me wapas" target (30/60/90/180/365; empty: 90). GADS_GEO=true adds Google Ads cost
          # by country (its own cache, data/roas_geo_cache*.json.gz); VALUE_CD=true adds new users by app version
          # and long-term by install month (no new GA4 call). All off / default until set.
          GA4_IDAY:             ${{ vars.GA4_IDAY || 'false' }}
          # IDAY_EXT=false (repo variable) stops the install-day fetch's extension (full Q-C: ages 91-427, paid vs
          # organic, ad units by install age, app_remove by country; new files only) without a code push
          IDAY_EXT:             ${{ vars.IDAY_EXT || 'true' }}
          GA4_VALUE:            ${{ vars.GA4_VALUE || 'false' }}
          GADS_GEO:             ${{ vars.GADS_GEO || 'false' }}
          VALUE_CD:             ${{ vars.VALUE_CD || 'false' }}
          # 🗄 Google Ads archive (admob_iq/fetch/gads_archive.py; PRIVATE data/ads_archive/, ads_campaign_day/,
          # ads_hourly/, ads_geo_day/ only — nothing is shown and no dashboard number reads it): the daily settings +
          # change history (Google keeps changes only ~30 days, so it is on from the start), rows per campaign × day,
          # spend by hour and (with GADS_GEO) country × day. GADS_ARCHIVE=false (repo variable) stops it without a push
          GADS_ARCHIVE:         ${{ vars.GADS_ARCHIVE || 'true' }}
          VALUE_PAYBACK_DAYS:   ${{ vars.VALUE_PAYBACK_DAYS }}
          # Audience (GA4 active users by install day over the trailing 1, 2, 3 … month windows, at most once a day per
          # app; data/ga4_audience/ in the private repo): GA4_AUDIENCE=true (repo variable) switches it on, off until set;
          # GA4_AUDIENCE_BUDGET_SEC = its seconds per build (empty: 180)
          GA4_AUDIENCE:         ${{ vars.GA4_AUDIENCE || 'false' }}
          GA4_AUDIENCE_BUDGET_SEC: ${{ vars.GA4_AUDIENCE_BUDGET_SEC }}
          # 🆕 First open: the strict GA4 funnel per app per day (admob_iq/fetch/ga4_firstopen.py; data/ga4_firstopen/ in
          # the private repo, kept for good — GA4 itself keeps only ~2 months, so it reads from day one):
          # GA4_FIRSTOPEN=false (repo variable) stops the reads without a code push
          GA4_FIRSTOPEN:        ${{ vars.GA4_FIRSTOPEN || 'true' }}
          GA4_FIRSTOPEN_BUDGET_SEC: ${{ vars.GA4_FIRSTOPEN_BUDGET_SEC }}
          # 🆕 First open by country (admob_iq/fetch/ga4_firstopen_cc.py; data/ga4_firstopen_cc/ in the private repo,
          # kept for good): GA4_FIRSTOPEN_CC=false (repo variable) stops the reads without a code push
          GA4_FIRSTOPEN_CC:     ${{ vars.GA4_FIRSTOPEN_CC || 'true' }}
          GA4_FIRSTOPEN_CC_BUDGET_SEC: ${{ vars.GA4_FIRSTOPEN_CC_BUDGET_SEC }}
          # 📈 Day-wise ROI: every day 0 … 30 of each install day's GA4 ad revenue (admob_iq/fetch/ga4_cohort.py;
          # data/ga4_cohort/ in the private repo, kept for good): GA4_COHORT=false stops the reads without a code push;
          # ROI_TAB=false takes the ROI section off the Install value tab
          GA4_COHORT:           ${{ vars.GA4_COHORT || 'true' }}
          GA4_COHORT_BUDGET_SEC: ${{ vars.GA4_COHORT_BUDGET_SEC }}
          # 🧊 The cohort cube (admob_iq/fetch/ga4_cube.py; data/ga4_cube/ in the private repo, kept for good): GA4 ad
          # revenue by activity day × install day × country from the history start — the ROI section's 30-day columns
          # past D30 (D60, D90 … up to the app's age). GA4_CUBE=false stops the reads and the columns (the page's file
          # as without them) without a code push; GA4_CUBE_BUDGET_SEC = its seconds per build (empty: 150)
          GA4_CUBE:             ${{ vars.GA4_CUBE || 'true' }}
          GA4_CUBE_BUDGET_SEC:  ${{ vars.GA4_CUBE_BUDGET_SEC }}
          # Its whole no-country day read (q, ages 31-420): GA4_CUBE_Q_CALLS = the history fill's calls a build (empty:
          # 120; 0 = q off: no read, the columns from the cube's own cells as before), GA4_CUBE_Q_SEC = its seconds a
          # build (empty: 20, inside the budget above), GA4_CUBE_Q_USE=false = reads go on, the page ignores them
          GA4_CUBE_Q_CALLS:     ${{ vars.GA4_CUBE_Q_CALLS }}
          GA4_CUBE_Q_SEC:       ${{ vars.GA4_CUBE_Q_SEC }}
          # GA4_CUBE_Q_APP_CALLS: the fill's own calls an app a run (empty / 0: the app's per-run cap bounds it too)
          GA4_CUBE_Q_APP_CALLS: ${{ vars.GA4_CUBE_Q_APP_CALLS }}
          GA4_CUBE_Q_USE:       ${{ vars.GA4_CUBE_Q_USE || 'true' }}
          ROI_TAB:              ${{ vars.ROI_TAB || 'true' }}
          # 🔮 Forecast engine (inside the ROI section): vd = the forecast tournament's winner (default); FORECAST_ENGINE=v0
          # (repo variable) rolls back to the earlier engine without a code push (each app re-made by it within a day)
          FORECAST_ENGINE:      ${{ vars.FORECAST_ENGINE || 'vd' }}
          # Update impact card: IMPACT_WINDOWS=false (repo variable) turns off its 14 / 30 / 60-day windows and the
          # late-effect alerts without a code push (the 7-day card as before)
          IMPACT_WINDOWS:       ${{ vars.IMPACT_WINDOWS || 'true' }}
          # Update impact "compare any date" (every day of the last year, precomputed lazy files; never an alert):
          # IMPACT_ANY=false (repo variable) turns it off without a code push (its files removed)
          IMPACT_ANY:           ${{ vars.IMPACT_ANY || 'true' }}
          # Uninstall Studio (the Uninstall tab's All-apps view, one lazy file; never an alert): UNINSTALL_STUDIO=false
          # (repo variable) turns it off without a code push (its file removed, the older All-apps views as before)
          UNINSTALL_STUDIO:     ${{ vars.UNINSTALL_STUDIO || 'true' }}
          # Active users Studio (the Active users tab's All-apps view, one lazy file; never an alert): ACTIVE_STUDIO=false
          # (repo variable) turns it off without a code push (its file removed, the older All-apps views as before)
          ACTIVE_STUDIO:        ${{ vars.ACTIVE_STUDIO || 'true' }}
          # Install value Studio (the Install value tab's All-apps view, one lazy file; never an alert): VALUE_STUDIO=false
          # (repo variable) turns it off without a code push (its file removed, the older All-apps views as before)
          VALUE_STUDIO:         ${{ vars.VALUE_STUDIO || 'true' }}
          # Audience tab (who still has each app, who went quiet and for how many months; one lazy file; never an
          # alert): AUDIENCE_TAB=false (repo variable) turns it off without a code push (its file and pointer removed)
          AUDIENCE_TAB:         ${{ vars.AUDIENCE_TAB || 'true' }}
          # 🆕 First open tab (firstopen.json.gz): FIRSTOPEN_TAB=false turns it off without a code push
          FIRSTOPEN_TAB:        ${{ vars.FIRSTOPEN_TAB || 'true' }}
          # Daily App Review (Review tab): REVIEW_ENABLED=true (repo variable) starts the daily card snapshots — set it
          # only after the Review API (Worker) is live; REVIEW_READY_IST = when the day's cards freeze (IST, empty: 09:00);
          # REVIEW_REBUILD_DAY=<YYYY-MM-DD> rebuilds TODAY's cards once (any other day is ignored).
          REVIEW_ENABLED:       ${{ vars.REVIEW_ENABLED || 'false' }}
          REVIEW_READY_IST:     ${{ vars.REVIEW_READY_IST }}
          REVIEW_REBUILD_DAY:   ${{ vars.REVIEW_REBUILD_DAY }}
          # Review Studio (the Review tab's Studio, one lazy file per review day, frozen with that day's cards; never an
          # alert): REVIEW_STUDIO=false (repo variable) turns it off without a code push (its files and pointer removed,
          # the older Review tab exactly as before)
          REVIEW_STUDIO:        ${{ vars.REVIEW_STUDIO || 'true' }}
          # Every change split into "installs ki wajah se" / "asli badlaav": SPLIT=false (repo variable) turns the
          # split off without a code push (the page and the alerts as before)
          SPLIT:                ${{ vars.SPLIT || 'true' }}
          # ⏱ Speed only (the same files either way; empty: the code's defaults) — each a rollback without a code push:
          # GADS_SPEND_WORKERS=1 asks the Google Ads accounts one after another, IMPACT_ANY_WORKERS=0 builds "compare
          # any date" in the build's own process, GA4_FIRSTOPEN_CC_BATCH=1 reads First open by country one call at a time
          # a property and GA4_FIRSTOPEN_CC_WORKERS=6 reads 6 properties side by side (both set: as before this change)
          GADS_SPEND_WORKERS:   ${{ vars.GADS_SPEND_WORKERS }}
          IMPACT_ANY_WORKERS:   ${{ vars.IMPACT_ANY_WORKERS }}
          GA4_FIRSTOPEN_CC_BATCH: ${{ vars.GA4_FIRSTOPEN_CC_BATCH }}
          GA4_FIRSTOPEN_CC_WORKERS: ${{ vars.GA4_FIRSTOPEN_CC_WORKERS }}
          # ⏱ History files (the same data either way; empty: the new path) — each a rollback without a code push:
          # REPO_FAST_WRITE=false writes the history files with json.dump, REPO_SKIP_UNCHANGED=false rewrites every one
          # each run.
          REPO_FAST_WRITE:      ${{ vars.REPO_FAST_WRITE }}
          REPO_SKIP_UNCHANGED:  ${{ vars.REPO_SKIP_UNCHANGED }}
        run: |
          # PRIVACY: Actions logs on a PUBLIC repo are world-readable and the build prints
          # app ids and revenue totals. So its output goes to a file, never to the log. On
          # failure we show only the tail with long digit runs masked, which keeps the error
          # text readable ("OAuth fail", "PERMISSION_DENIED") while hiding ids and figures.
          # /tmp/build_wall: this step's own wall clock around the build (the stage-time step below compares it)
          date +%s.%N > /tmp/build_wall
          if python -m admob_iq.build_static > /tmp/build.log 2>&1; then
            date +%s.%N >> /tmp/build_wall
            echo "build complete"
          else
            date +%s.%N >> /tmp/build_wall
            echo "::error::build failed — tail below, digits masked for privacy"
            # mask decimals FIRST (a revenue figure like 89.43 has no 4-digit run),
            # then any long digit run (publisher ids, app ids, counts).
            tail -n 30 /tmp/build.log | sed -E 's/[0-9]+\.[0-9]+/#.##/g; s/[0-9]{4,}/####/g'
            exit 1
          fi

      - name: Build time per stage (stage names + seconds only)
        # admob_iq/stage_clock.py timed every stage of the build into the PRIVATE data/build_profile.json.gz (this
        # build + the last 48). PUBLIC LOG: it prints only "stage <name> <sec>s" lines: the total, every stage of 20 s
        # or more, this step's wall clock (step_wall) and what fell outside the build (outside_build). Names come from
        # a fixed allow-list of code identifiers (stage_clock.STAGES), whole seconds only: never an app, account, file
        # name or amount. It also runs after a failed build (that build's stages), and it never fails the run.
        # A failed build's profile is NOT pushed (the push step below runs only after a good build; a push from a
        # failed run could look like a fresh refresh to the watchers), so these lines are its only record; the private
        # history's run numbers show that run as a gap.
        if: always()
        continue-on-error: true
        run: python -m admob_iq.stage_clock public data/build_profile.json.gz /tmp/build_wall 2>/dev/null || true

      - name: Deploy guard report (Cloudflare limits, counts only)
        # admob_iq/deploy_guard.py ran at the end of the build. It keeps the site inside Cloudflare's deploy limits
        # (_headers rules, file count, file size, file names) and fixes what it can. Whatever it could NOT fix becomes a
        # ::warning:: here, COUNTS ONLY (this log is public: no file or app names, no amounts). It never stops the push
        # below: the data is pushed either way, so a deploy can only stay stuck for a reason outside our content.
        continue-on-error: true
        run: python -m admob_iq.deploy_guard annotate deploy_guard.json

      - name: Data files under GitHub's file size limit (counts only)
        # GitHub refuses a push that carries a file over 100 MB (and warns from 50 MB): the push below would then fail
        # every run and the dashboard would stop updating. PUBLIC LOG: counts only, never a file name or size.
        continue-on-error: true
        run: |
          over90=$(find data -type f -size +90M 2>/dev/null | wc -l | tr -d ' ')
          over50=$(find data -type f -size +50M 2>/dev/null | wc -l | tr -d ' ')
          echo "data files over 50 MB: ${over50:-0}, over 90 MB: ${over90:-0}"
          if [ "${over90:-0}" != 0 ]; then echo "::warning::${over90} data file(s) over 90 MB: GitHub refuses a pushed file over 100 MB"; fi

      - name: Push refreshed data + site back to the PRIVATE repo
        run: |
          cp -f frontend/index.html site/index.html 2>/dev/null || true
          cd _private
          git config user.name  "admob-iq-bot"
          git config user.email "admob-iq-bot@users.noreply.github.com"
          # Race-proof: always rebuild on top of whatever is on the remote right now, then
          # push. Retry a few times in case another run lands in between.
          pushed=0
          for i in 1 2 3 4 5; do
            git fetch --depth=1 origin main > /dev/null 2>&1
            git reset --hard origin/main    > /dev/null 2>&1
            rm -rf data site && mkdir -p data site
            cp -a ../data/. data/ 2>/dev/null || true
            cp -a ../site/. site/ 2>/dev/null || true
            # Deploy guard report (admob_iq/deploy_guard.py) → PRIVATE data/ only, for the watchdog on the Mac; never site/
            # (it names files). Any copy from an earlier run is removed first, so a missing report is never mistaken for a fresh one.
            rm -f data/deploy_guard.json
            if [ -f ../deploy_guard.json ]; then cp -f ../deploy_guard.json data/deploy_guard.json; fi
            # Review API (Worker) code → private worker/. Synced only when this checkout has it, every file parses AND
            # index.js links (a real import: a missing module / export passes --check but fails the Workers build);
            # otherwise worker/ stays exactly as on the remote (a missing folder never breaks this push).
            # src/package.json ({"type":"module"}) is required: without it newer node lets a broken ES module pass --check.
            if [ -f ../review_worker/src/index.js ] && [ -f ../review_worker/src/package.json ] && command -v node >/dev/null 2>&1 \
               && ( for f in ../review_worker/src/*.js; do node --check "$f" >/dev/null 2>&1 || exit 1; done ) \
               && node --input-type=module -e 'const { pathToFileURL } = await import("node:url"); await import(pathToFileURL(process.argv[1]).href);' \
                    ../review_worker/src/index.js >/dev/null 2>&1; then
              rm -rf worker && mkdir -p worker && cp -a ../review_worker/src/. worker/
            fi
            git add -A data site
            if [ -d worker ]; then git add -A worker; fi
            if git diff --cached --quiet; then echo "nothing to commit"; pushed=1; break; fi
            git commit -q -m "refresh $(date -u '+%F %H:%M') UTC"
            if git push -q origin HEAD:main 2>/dev/null; then echo "pushed on attempt $i"; pushed=1; break; fi
            echo "push attempt $i rejected — retrying on latest main"; sleep 5
          done
          [ "$pushed" = 1 ] || { echo "::error::push to the private repo failed after 5 attempts"; exit 1; }

      - name: Deploy the pushed site to Cloudflare (direct, does not wait for Workers Builds)
        # WHY: Cloudflare Workers Builds (the push-to-deploy hook on the private repo) has failed to deploy for hours at
        # a time (a toolchain change in its build image broke every build) while every refresh here succeeded, so the
        # dashboard kept showing old data. This step
        # deploys the exact tree just pushed, with the private repo's own wrangler.toml: the same `wrangler deploy`
        # Workers Builds runs. Builds stays connected as a second path; deploying the same files twice is harmless
        # (assets are content-hashed and unchanged files are not uploaded again). Worker secrets are kept by deploy.
        # Runs even when there was nothing new to commit, so a deploy missed earlier is caught up here.
        # PRIVACY: wrangler output names the account, email, vars, hosts and ids, so it goes to a file and is NEVER
        # printed; on failure only a fixed class and Cloudflare's numeric error codes are shown.
        # wrangler is pinned on purpose (an unpinned toolchain is what broke Workers Builds): bump it deliberately.
        # It never blocks the compaction below: a failed deploy is an ::error:: and the next run deploys again.
        continue-on-error: true
        timeout-minutes: 15
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare deploy secrets not set: deploy left to Workers Builds"; exit 0
          fi
          cd _private
          # wrangler's scratch files must never be committed by the compaction step's `git add -A` (local exclude, not a commit)
          mkdir -p .git/info && printf '.wrangler/\nnode_modules/\n' >> .git/info/exclude
          # workers.dev and preview URLs bypass Cloudflare Access: both must be TOP-LEVEL false (a line under [vars] does not count)
          worker=$(python3 -c 'import tomllib; c = tomllib.load(open("wrangler.toml", "rb")); print(c.get("name", "") if c.get("workers_dev") is False and c.get("preview_urls") is False else "")' 2>/dev/null) || worker=""
          [ -n "$worker" ] || { echo "::error::wrangler.toml must keep top-level workers_dev = false and preview_urls = false: deploy skipped"; exit 1; }
          sha=$(git rev-parse --short=12 HEAD)
          ok=0; rc=0
          for i in 1 2 3; do
            rc=0; timeout -k 10 240 npx -y wrangler@4.151.1 deploy --tag "$sha" --message "runner" > /tmp/deploy.log 2>&1 || rc=$?
            if [ "$rc" = 0 ]; then ok=1; echo "deployed on attempt $i"; break; fi
            echo "deploy attempt $i failed (exit $rc)"; [ "$i" = 3 ] || sleep $((i * 20))
          done
          if [ "$ok" != 1 ]; then
            # PUBLIC LOG: never print wrangler's own lines. Only a fixed class + Cloudflare's numeric error codes.
            codes=$(grep -oE 'code: [0-9]+' /tmp/deploy.log | grep -oE '[0-9]+' | sort -u | head -5 | paste -sd, - || true)
            cls=other
            if [ "$rc" = 124 ]; then cls=timeout
            elif grep -q 'Authentication error' /tmp/deploy.log; then cls=auth
            elif grep -q 'Build failed' /tmp/deploy.log; then cls=bundle
            fi
            echo "::error::Cloudflare deploy failed 3 times (class: $cls, last exit: $rc, Cloudflare codes: ${codes:-none}); details stay private"
            exit 1
          fi
          # belt and braces: the Worker's workers.dev and preview URLs must still be off after the deploy
          resp=$(curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                 "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker/subdomain" 2>/dev/null) || true
          sub=$(printf '%s' "$resp" | python3 -c 'import json,sys; r=json.load(sys.stdin)["result"]; print("open" if r.get("enabled") or r.get("previews_enabled") else "closed")' 2>/dev/null) || sub=unknown
          echo "workers.dev / preview URLs: $sub"
          case "$sub" in
            closed) ;;
            open) echo "::error::workers.dev or preview URLs are ON after the deploy: tell the owner"; exit 1 ;;
            *) echo "::warning::workers.dev / preview URL status could not be read after the deploy: check it from the Mac" ;;
          esac

      - name: Compact the private repo when it grows too big
        if: success()
        env:
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          MAX_REPO_MB: "2500"          # compact past this; GitHub warns around 5 GB
        run: |
          # Every run rewrites the .gz history files whose content changed (an unchanged one is left
          # byte for byte), so the private repo's git history still grows every run. The HISTORY
          # of those files carries no information: each file already holds the full time
          # series. So once the repo passes MAX_REPO_MB we replace the history with a single
          # commit containing the exact same working tree. Every tracked file survives
          # (data incl. its sub-folders, site, config, code, workflows) — only old git revisions are dropped.
          size_kb=$(curl -fsS -H "Authorization: Bearer $DATA_REPO_TOKEN" \
                         -H "Accept: application/vnd.github+json" \
                         "https://api.github.com/repos/$DATA_REPO" 2>/dev/null \
                    | python3 -c "import json,sys; print(int(json.load(sys.stdin).get('size') or 0))" 2>/dev/null || echo 0)
          echo "private repo: $((size_kb/1024)) MB (compact above ${MAX_REPO_MB} MB)"
          if [ "${size_kb:-0}" -le $((MAX_REPO_MB*1024)) ]; then echo "no compaction needed"; exit 0; fi
          cd _private
          # Compact the LATEST remote tree, not this run's copy — keeps anything another job pushed
          # after our push (e.g. the ga4/ probe output), so the force-push never drops a file.
          git fetch -q --depth=1 origin main && git reset -q --hard origin/main
          # remember what main was, so the force-push below is refused if anyone (e.g. the ga4
          # probe) pushed in between — instead of silently dropping their commit
          base=$(git rev-parse origin/main)
          # SAFETY: never force-push an empty or half-built tree over the real history.
          # (dashboard ships gzipped since 2026-09 — the old plain-name check skipped EVERY
          #  compaction and let the repo grow to ~62 GB; accept either name.)
          { test -s site/dashboard.json.gz || test -s site/dashboard.json; } \
            || { echo "::warning::dashboard.json(.gz) missing — compaction skipped"; exit 0; }
          test -n "$(ls -A data 2>/dev/null)" || { echo "::warning::data/ is empty — compaction skipped"; exit 0; }
          git checkout -q --orphan _compact
          git add -A
          git -c user.name="admob-iq-bot" -c user.email="admob-iq-bot@users.noreply.github.com" \
              commit -q -m "compact history $(date -u '+%F') — same files, old git revisions dropped"
          if git push -q --force-with-lease=main:"$base" origin _compact:main 2>/dev/null; then
            echo "history compacted — repo back to roughly the size of one snapshot"
          else
            echo "::warning::compaction push failed (or main moved meanwhile) — nothing lost, it will retry next run"
          fi
