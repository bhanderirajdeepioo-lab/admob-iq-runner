# One-off: 🆕 First open BY COUNTRY (owner: "country wise bhi dekh saku esa kara do"). Measures what a country-wise strict
# funnel costs on the real properties (countries per day, calls, tokens, sampling, coverage of the app's total) before it
# is built. See admob_iq/fetch/ga4_firstopen_country_probe.py. Read-only against GA4 and the PRIVATE repo's data; the only
# write is ga4/firstopen_country_probe.json in the PRIVATE repo. This repo's Actions log is PUBLIC: counts only; stderr
# (which could echo request details) is hidden.
name: ga4-firstopen-country-probe

on:
  workflow_dispatch:
    inputs:
      max_apps:
        description: "probe only the N biggest apps (0 = all)"
        required: false
        default: "0"

permissions:
  contents: read                 # this repo is never written to

concurrency:
  group: ga4-firstopen-country-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30          # the probe starts no GA4 call after 22 min and then writes what it has
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -q -r requirements.txt
      - name: Read the PRIVATE data (read-only clone)
        env:
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          test -n "$DATA_REPO"       || { echo "::error::DATA_REPO secret missing"; exit 1; }
          test -n "$DATA_REPO_TOKEN" || { echo "::error::DATA_REPO_TOKEN secret missing"; exit 1; }
          # the token goes in a header for this one command only: never into a URL, a file or .git/config
          auth=$(printf 'x-access-token:%s' "$DATA_REPO_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic $auth" clone -q --depth=1 \
            "https://github.com/$DATA_REPO.git" _private > /dev/null 2>&1 \
            || { echo "::error::could not clone the private data repo (details kept off the public log)"; exit 1; }
          echo "private data: $(ls -1 _private/data/ga4_uninstall 2>/dev/null | wc -l) file(s)"
      - name: Run
        env:
          GA4_REFRESH_TOKENS: ${{ secrets.GA4_REFRESH_TOKENS }}
          GA4_REFRESH_TOKEN: ${{ secrets.GA4_REFRESH_TOKEN }}
          GA4_CLIENT_ID: ${{ secrets.GA4_CLIENT_ID }}
          GA4_CLIENT_SECRET: ${{ secrets.GA4_CLIENT_SECRET }}
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          FIRSTOPEN_DATA_DIR: _private
          FIRSTOPEN_MAX_APPS: ${{ github.event.inputs.max_apps }}
          PYTHONUNBUFFERED: "1"
        run: python -m admob_iq.fetch.ga4_firstopen_country_probe 2>/tmp/firstopen.err || { echo "::error::first-open country probe failed (details kept off the public log)"; exit 1; }
