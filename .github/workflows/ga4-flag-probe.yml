# One-off: the GA4 FLAG probe — which GA4 signal is the cohort cube's "fl" mark on a day (thresholding, sampling, a cut
# answer, dataLossFromOtherRow), and does any read shape come back whole? It reads the flagged days (and unflagged days
# beside them) of the 2 apps with the most flagged final days again, in the cube's own shape and smaller ones, keeping
# GA4's own response metadata of every read. See admob_iq/fetch/ga4_flag_probe.py. Read-only against GA4 and against
# the PRIVATE repo's data (app routes, the cube's month files); the only write is ga4/flag_probe.json in the PRIVATE
# repo. At most 70 GA4 calls a run, under the quota floors of the other probes and of the build.
# This repo's Actions log is PUBLIC: progress counts and counts-only result lines; stderr is hidden, and the inputs are
# read by the probe from the event file only — never put into a step's env or script.
name: ga4-flag-probe

on:
  workflow_dispatch:
    inputs:
      max_calls:
        description: "GA4 calls this run at most (empty = 70; never more than 70)"
        required: false
        default: ""
      resume:
        description: "true = days the last report read whole are kept, the calls go to the next days"
        required: false
        default: ""

permissions:
  contents: read                 # this repo is never written to

concurrency:
  group: ga4-flag-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    # the probe starts no GA4 call 20 min after IT starts, then writes what it has; before it: setup + the clone (capped
    # at 8 min below) + reading the cube's month files; after: the last in-flight call + the private write. 45 leaves
    # room for all of it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -q -r requirements.txt
      - name: Read the PRIVATE data (a read-only clone, for the app routes and the cube's month files)
        env:
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          test -n "$DATA_REPO"       || { echo "::error::DATA_REPO secret missing"; exit 1; }
          test -n "$DATA_REPO_TOKEN" || { echo "::error::DATA_REPO_TOKEN secret missing"; exit 1; }
          # the token goes in a header for this one command only: never into a URL, a file or .git/config; a clone
          # slower than 8 min is given up (the probe then has no cube store to choose by and stops before any GA4 call)
          auth=$(printf 'x-access-token:%s' "$DATA_REPO_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          if timeout 480 git -c http.extraheader="AUTHORIZATION: basic $auth" clone -q --depth=1 \
               "https://github.com/$DATA_REPO.git" _private > /dev/null 2>&1; then
            echo "private data: cloned"
          else
            rm -rf _private
            echo "::warning::private data not cloned: the probe stops before any GA4 call"
          fi
      - name: Run
        env:
          GA4_REFRESH_TOKENS: ${{ secrets.GA4_REFRESH_TOKENS }}
          GA4_REFRESH_TOKEN: ${{ secrets.GA4_REFRESH_TOKEN }}
          GA4_CLIENT_ID: ${{ secrets.GA4_CLIENT_ID }}
          GA4_CLIENT_SECRET: ${{ secrets.GA4_CLIENT_SECRET }}
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          FLAG_DATA_DIR: _private
          PYTHONUNBUFFERED: "1"
        run: python -m admob_iq.fetch.ga4_flag_probe 2>/tmp/flag.err || { echo "::error::flag probe failed (details kept off the public log)"; exit 1; }
