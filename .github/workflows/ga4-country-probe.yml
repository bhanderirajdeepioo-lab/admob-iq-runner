# One-off: the GA4 COUNTRY capability probe — the full country read without its install-day list (ages 91..427) tied to
# Q-B, paid vs organic split by a first-user attribution dimension, whole-app country totals, app_remove by country and
# the dimensions that would measure missing ROI drivers. See admob_iq/fetch/ga4_country_probe.py. Read-only against GA4
# and against the PRIVATE repo's data; the only write is ga4/country_probe.json in the PRIVATE repo (run again with
# resume = true until every app is complete). This repo's Actions log is PUBLIC: progress counts and one counts-only
# line per test; stderr (which could echo request details) is hidden, and the inputs are read by the probe from the
# event file only — never put into a step's env or script.
name: ga4-country-probe

on:
  workflow_dispatch:
    inputs:
      max_apps:
        description: "probe only the first N apps (0 = all)"
        required: false
        default: "0"
      apps:
        description: "only these apps: comma list of file keys (empty = all)"
        required: false
        default: ""
      days:
        description: "T1 activity days: B+A around the pivot (e.g. 3+3), B+A/step (e.g. 3+3/7), or ISO days comma list"
        required: false
        default: "3+3"
      pivot:
        description: "first activity day GA4 kept whole (YYYY-MM-DD)"
        required: false
        default: "2026-07-25"
      t2_days:
        description: "paid/organic split on this many of the T1 days (newest from the pivot, newest before, ...)"
        required: false
        default: "2"
      max_calls:
        description: "GA4 calls this run at most"
        required: false
        default: "1500"
      resume:
        description: "continue the last report: done parts kept, the rest asked"
        type: boolean
        required: false
        default: false

permissions:
  contents: read                 # this repo is never written to

concurrency:
  group: ga4-country-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    # the probe starts no GA4 call 22 min after IT starts, then writes what it has; before it: setup + the clone (capped
    # at 8 min below); after: the last in-flight calls + the private write. 45 leaves room for all of it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -q -r requirements.txt
      - name: Read the PRIVATE data (a read-only clone, for the app routes and the last report)
        env:
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          test -n "$DATA_REPO"       || { echo "::error::DATA_REPO secret missing"; exit 1; }
          test -n "$DATA_REPO_TOKEN" || { echo "::error::DATA_REPO_TOKEN secret missing"; exit 1; }
          # the token goes in a header for this one command only: never into a URL, a file or .git/config; a clone
          # slower than 8 min is given up (the probe then reads the routes and its last report through the API)
          auth=$(printf 'x-access-token:%s' "$DATA_REPO_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          if timeout 480 git -c http.extraheader="AUTHORIZATION: basic $auth" clone -q --depth=1 \
               "https://github.com/$DATA_REPO.git" _private > /dev/null 2>&1; then
            echo "private data: cloned"
          else
            rm -rf _private
            echo "::warning::private data not cloned: routes and the last report are read through the API"
          fi
      - name: Run
        env:
          GA4_REFRESH_TOKENS: ${{ secrets.GA4_REFRESH_TOKENS }}
          GA4_REFRESH_TOKEN: ${{ secrets.GA4_REFRESH_TOKEN }}
          GA4_CLIENT_ID: ${{ secrets.GA4_CLIENT_ID }}
          GA4_CLIENT_SECRET: ${{ secrets.GA4_CLIENT_SECRET }}
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          COUNTRY_DATA_DIR: _private
          PYTHONUNBUFFERED: "1"
        run: python -m admob_iq.fetch.ga4_country_probe 2>/tmp/country.err || { echo "::error::country probe failed (details kept off the public log)"; exit 1; }
