# One-off: the Google Ads TIME ZONE probe — why the roster's account time zones came back empty (the install-day D0
# "By date" stopped). See admob_iq/fetch/gads_tz_probe.py. Read-only against Google Ads (the SAME secrets refresh.yml
# gives the Ads fetch); the only write is ga4/gads_tz_probe.json in the PRIVATE repo. This repo's Actions log is PUBLIC:
# counts only; stderr is hidden.
name: gads-tz-probe

on:
  workflow_dispatch:

permissions:
  contents: read                 # this repo is never written to

concurrency:
  group: gads-tz-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    # two roster reads + one small read per client account (≤ 80), then the private write (≤ 4 min of retries)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -q -r requirements.txt
      - name: Run
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN:   ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_ADS_REFRESH_TOKEN:     ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CLIENT_ID:         ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET:     ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          # the Ads fetch falls back to the AdMob OAuth client when GOOGLE_ADS_CLIENT_* are not set — so does the probe
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python -m admob_iq.fetch.gads_tz_probe 2>/tmp/gads_tz.err || { echo "::error::gads tz probe failed (details kept off the public log)"; exit 1; }
