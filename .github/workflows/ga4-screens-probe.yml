# One-off: the GA4 SCREENS probe — on the apps whose Screens ads-by-screen read is not whole, one day per request: is the
# fetch's own read whole when asked alone (old and new days, small and big ones), and is any other request shape GA4
# offers for ads by screen whole where the fetch's are sampled? See admob_iq/fetch/ga4_screens_probe.py.
# Read-only against GA4 and against the PRIVATE repo's data; the only write is ga4/screens_probe.json in the PRIVATE
# repo. This repo's Actions log is PUBLIC: a counts-only heartbeat and ONE counts-only result line; stderr is hidden, and
# the inputs are read by the probe from the event file only — never put into a step's env or script.
name: ga4-screens-probe

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "only these apps: comma list of file keys (empty = every app not whole + one control)"
        required: false
        default: ""

permissions:
  contents: read                 # this repo is never written to

concurrency:
  group: ga4-screens-probe
  cancel-in-progress: false

jobs:
  probe:
    # PINNED as refresh.yml: a new runner image is a deliberate change (1 Nov 2026: the zone names Google sends went
    # missing on ubuntu-latest)
    runs-on: ubuntu-24.04
    # the probe starts no GA4 call 20 min after IT starts, then writes what it has; before it: setup (~3) + the clone
    # (capped at 8 min below) + reading the store (~2); after: the last in-flight calls + the private write. 45 leaves
    # room for all of it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -q -r requirements.txt
      - name: Read the PRIVATE data (a read-only clone — the routes and the Screens store)
        env:
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          test -n "$DATA_REPO"       || { echo "::error::DATA_REPO secret missing"; exit 1; }
          test -n "$DATA_REPO_TOKEN" || { echo "::error::DATA_REPO_TOKEN secret missing"; exit 1; }
          # the token goes in a header for this one command only: never into a URL, a file or .git/config
          auth=$(printf 'x-access-token:%s' "$DATA_REPO_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          timeout 480 git -c http.extraheader="AUTHORIZATION: basic $auth" clone -q --depth=1 \
            "https://github.com/$DATA_REPO.git" _private > /dev/null 2>&1 \
            || { echo "::error::could not clone the private data repo"; exit 1; }
          echo "private data: cloned"
      - name: Run
        env:
          GA4_REFRESH_TOKENS: ${{ secrets.GA4_REFRESH_TOKENS }}
          GA4_REFRESH_TOKEN: ${{ secrets.GA4_REFRESH_TOKEN }}
          GA4_CLIENT_ID: ${{ secrets.GA4_CLIENT_ID }}
          GA4_CLIENT_SECRET: ${{ secrets.GA4_CLIENT_SECRET }}
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          SCREENS_PROBE_DATA_DIR: _private
          PYTHONUNBUFFERED: "1"
        run: python -m admob_iq.fetch.ga4_screens_probe 2>/tmp/screens_probe.err || { echo "::error::screens probe failed (details kept off the public log)"; exit 1; }
