# One-off: the GA4 ACTIVITY probe — per app and Activity (screen class): its views, the ad impressions GA4 logs on it
# (ad_impression events) and where each ad format lands, whether each split is whole over the 28 final days, day by day,
# on the newest days and over the history; GA4's impressions against AdMob's own (offline, the clone).
# See admob_iq/fetch/ga4_activity_probe.py.
# Read-only against GA4 and against the PRIVATE repo's data; the only write is ga4/activity_probe.json in the
# PRIVATE repo.
# This repo's Actions log is PUBLIC: a counts-only heartbeat and ONE counts-only result line; stderr is hidden, and the
# inputs are read by the probe from the event file only — never put into a step's env or script.
name: ga4-activity-probe

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "only these apps: comma list of file keys (empty = all)"
        required: false
        default: ""

permissions:
  contents: read                 # this repo is never written to

concurrency:
  group: ga4-activity-probe
  cancel-in-progress: false

jobs:
  probe:
    # PINNED as refresh.yml: a new runner image is a deliberate change (1 Nov 2026: the zone names Google sends went
    # missing on ubuntu-latest); tzdata in requirements.txt is the second guard, "zone missing" in the log the third
    runs-on: ubuntu-24.04
    # the probe starts no GA4 call 20 min after IT starts, then writes what it has; before it: setup (~3) + the clone
    # (capped at 8 min below) + the AdMob report (~1); after: the last in-flight calls + the private write (~4). 45 leaves
    # room for all of it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -q -r requirements.txt
      - name: Read the PRIVATE data (a read-only clone, for the app routes and the AdMob report)
        env:
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          test -n "$DATA_REPO"       || { echo "::error::DATA_REPO secret missing"; exit 1; }
          test -n "$DATA_REPO_TOKEN" || { echo "::error::DATA_REPO_TOKEN secret missing"; exit 1; }
          # the token goes in a header for this one command only: never into a URL, a file or .git/config; a clone
          # slower than 8 min is given up (the probe then reads the routes through the API, without the AdMob check)
          auth=$(printf 'x-access-token:%s' "$DATA_REPO_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          if timeout 480 git -c http.extraheader="AUTHORIZATION: basic $auth" clone -q --depth=1 \
               "https://github.com/$DATA_REPO.git" _private > /dev/null 2>&1; then
            echo "private data: cloned"
          else
            rm -rf _private
            echo "::warning::private data not cloned: routes are read through the API, no AdMob check"
          fi
      - name: Run
        env:
          GA4_REFRESH_TOKENS: ${{ secrets.GA4_REFRESH_TOKENS }}
          GA4_REFRESH_TOKEN: ${{ secrets.GA4_REFRESH_TOKEN }}
          GA4_CLIENT_ID: ${{ secrets.GA4_CLIENT_ID }}
          GA4_CLIENT_SECRET: ${{ secrets.GA4_CLIENT_SECRET }}
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          ACTIVITY_DATA_DIR: _private
          PYTHONUNBUFFERED: "1"
        run: python -m admob_iq.fetch.ga4_activity_probe 2>/tmp/activity.err || { echo "::error::activity probe failed (details kept off the public log)"; exit 1; }
