<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a1120">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AdMob IQ">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>AdMob IQ — Dashboard</title>
<style>
  :root{--bg:#0a1120;--bg2:#0d1626;--panel:#111d31;--panel2:#0f1a2c;--raise:#16233a;--line:#213249;--line2:#2b3f5c;
    --ink:#e8eefb;--ink2:#c2cee3;--muted:#8496b5;--faint:#61748f;--blue:#3b82f6;--blue2:#2f6bff;--cyan:#22d3ee;--cyan2:#20b8d8;
    --good:#34d99a;--good-b:#123a2f;--watch:#e6b84e;--watch-b:#3a2f12;--bad:#ff6b6b;--bad-b:#3a1717;--purple:#a78bfa;--purple-b:#241a3d;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.5}
  .app{display:flex;min-height:100vh}
  aside{width:220px;flex:none;background:linear-gradient(180deg,#0c1424,#0a1120);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--blue2),var(--cyan));display:grid;place-items:center;font-size:18px}
  .brand .nm{font-weight:800;font-size:15px;line-height:1.1}.brand .nm small{display:block;font-weight:600;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .nav-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
  .nav{list-style:none;margin:0;padding:0}
  .nav button{width:100%;display:flex;align-items:center;gap:11px;background:none;border:none;color:var(--ink2);font-size:13.5px;font-weight:600;padding:9px 10px;border-radius:9px;cursor:pointer;text-align:left;font-family:inherit}
  .nav button .i{font-size:15px;width:18px;text-align:center}
  .nav button:hover{background:var(--raise);color:#fff}
  .nav button.active{background:linear-gradient(90deg,rgba(47,107,255,.22),rgba(34,211,238,.1));color:#fff;box-shadow:inset 0 0 0 1px rgba(59,130,246,.35)}
  .nav button .badge{margin-left:auto;font-size:10px;font-weight:800;background:var(--bad);color:#fff;padding:1px 7px;border-radius:100px}
  .side-foot{margin-top:16px;padding:12px 10px;border-top:1px solid var(--line);font-size:11px;color:var(--faint)}
  main{flex:1;min-width:0}
  .topbar{position:sticky;top:0;z-index:10;background:rgba(10,17,32,.85);backdrop-filter:blur(9px);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:12px}
  .topbar h1{font-size:17px;margin:0;font-weight:750}.topbar .sub{color:var(--muted);font-size:12px}
  .spacer{flex:1}.ctrl{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line2);color:var(--ink2);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
  .ctrl .cx{color:var(--muted);font-weight:500}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line2);border-radius:9px;overflow:hidden}
  .seg button{background:none;border:none;color:var(--ink2);font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 11px;cursor:pointer;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:none}.seg button.on{background:linear-gradient(90deg,var(--blue2),var(--cyan2));color:#fff}.seg button:hover:not(.on){background:var(--raise)}
  .live{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-size:12px;font-weight:700}
  .dot-live{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(52,217,154,.2)}
  .content{padding:22px 24px 50px;max-width:1200px}
  .screen{display:none}.screen.on{display:block}
  h2.sc{font-size:20px;margin:0 0 3px;font-weight:800}p.scd{margin:0 0 16px;color:var(--muted);font-size:13px}
  .row{display:grid;gap:14px}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}.c5{grid-template-columns:repeat(5,1fr)}.c6{grid-template-columns:repeat(6,1fr)}.c7{grid-template-columns:repeat(7,1fr)}.span2{grid-column:span 2}
  @media(max-width:1000px){.c4,.c5{grid-template-columns:repeat(2,1fr)}.c6,.c7{grid-template-columns:repeat(3,1fr)}.c3{grid-template-columns:1fr}.span2{grid-column:auto}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px 17px}.card.pad0{padding:0;overflow:hidden}
  .ct{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.ct h3{font-size:14px;margin:0;font-weight:700}.ct .lnk{font-size:11.5px;color:var(--cyan);cursor:pointer;font-weight:600}
  .muted{color:var(--muted)}.faint{color:var(--faint)}.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--watch)}
  .kpi .l{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}.kpi .v{font-size:24px;font-weight:800;margin-top:4px;letter-spacing:-.01em}.kpi .d{font-size:12px;font-weight:700;margin-top:3px}
  .spark{display:flex;align-items:flex-end;gap:2px;height:26px;margin-top:10px}.spark i{flex:1;background:linear-gradient(180deg,var(--cyan),var(--blue2));border-radius:2px;opacity:.85;min-height:3px}
  .spark.g i{background:linear-gradient(180deg,#6ee7b7,var(--good))}.spark.r i{background:linear-gradient(180deg,#ff9a9a,var(--bad))}
  .spark.o i{background:linear-gradient(180deg,#fcd34d,var(--watch))}   /* ad spend — its own colour, not "bad" */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:11px 14px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;border-bottom:1px solid var(--line);background:var(--panel2)}
  td{padding:11px 14px;border-bottom:1px solid var(--line);color:var(--ink2)}tr:last-child td{border-bottom:none}td.nm{color:#fff;font-weight:600}
  tbody tr.clk{cursor:pointer}tbody tr.clk:hover td{background:var(--raise)}
  .grp td{background:var(--bg2);color:#fff;font-weight:700;font-size:12.5px}.grp .cnt{color:var(--muted);font-weight:500;font-size:11.5px}
  .more td{text-align:center;color:var(--cyan);font-size:12px;font-weight:600;background:var(--panel2)}
  .pill{font-size:11px;font-weight:800;padding:2px 9px;border-radius:100px;display:inline-block;white-space:nowrap}
  .p-g{background:var(--good-b);color:var(--good)}.p-y{background:var(--watch-b);color:var(--watch)}.p-r{background:var(--bad-b);color:var(--bad)}.p-b{background:#15294a;color:#6ea8ff}.p-p{background:var(--purple-b);color:var(--purple)}
  .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--raise);color:var(--ink2)}
  .hs{display:inline-grid;place-items:center;width:34px;height:26px;border-radius:7px;font-weight:800;font-size:12.5px}
  .hs.good{background:var(--good-b);color:var(--good)}.hs.watch{background:var(--watch-b);color:var(--watch)}.hs.risk{background:var(--bad-b);color:var(--bad)}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:100px;border:1px solid var(--line2);color:var(--ink2);background:var(--panel);cursor:pointer}
  .chip.on{background:linear-gradient(90deg,var(--blue2),var(--cyan2));color:#fff;border-color:transparent}
  .feed{display:grid;gap:8px}
  .al{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-left:3px solid;border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--ink2)}
  .al b{color:#fff}.al.crit{border-left-color:var(--bad)}.al.warning{border-left-color:var(--watch)}.al.watch{border-left-color:#6ea8ff}.al.good{border-left-color:var(--good);background:linear-gradient(90deg,rgba(52,217,154,.06),var(--panel2))}.al.p{border-left-color:var(--purple)}
  .alert{display:flex;gap:13px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-left:4px solid;border-radius:11px;padding:13px 15px}
  .alert.crit{border-left-color:var(--bad);background:linear-gradient(90deg,rgba(255,107,107,.06),var(--panel))}.alert.warning{border-left-color:var(--watch)}.alert.watch{border-left-color:#6ea8ff}.alert.good{border-left-color:var(--good);background:linear-gradient(90deg,rgba(52,217,154,.06),var(--panel))}
  .alert .abody{flex:1;min-width:0}.alert .atitle{font-weight:750;color:#fff;font-size:13.5px}.alert .ameta{font-size:12px;color:var(--muted);margin-top:2px}
  .alert .acause{font-size:12px;color:var(--ink2);margin-top:7px;background:var(--panel2);padding:6px 10px;border-radius:7px}
  .alert .aact{display:flex;gap:7px;margin-top:9px}.abtn{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:7px;border:1px solid var(--line2);color:var(--ink2);background:var(--raise);cursor:pointer}.abtn.pri{background:linear-gradient(90deg,var(--blue2),var(--cyan2));color:#fff;border-color:transparent}
  .aval{text-align:right;min-width:88px}.aval .big{font-size:16px;font-weight:800}.aval .sm{font-size:11px;color:var(--muted)}
  .rule{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}.rule:last-child{border-bottom:none}
  .tgl{width:34px;height:19px;border-radius:100px;background:var(--good);position:relative;flex:none}.tgl.off{background:var(--raise)}.tgl::after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;top:2px;right:2px}.tgl.off::after{right:auto;left:2px}
  .mv{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}.mv:hover{background:var(--raise)}
  .mv .mvinfo{flex:1;min-width:0}.mv .mvname{font-weight:650;color:#fff;font-size:13px}.mv .mvapp{font-size:11px;color:var(--muted)}.mv .mvt{font-weight:800;font-size:14px;min-width:52px;text-align:right}
  .microbar{display:inline-flex;align-items:flex-end;gap:1.5px;height:16px;vertical-align:middle}.microbar i{width:3px;background:var(--blue);border-radius:1px;opacity:.8}.microbar.g i{background:var(--good)}.microbar.r i{background:var(--bad)}
  .appcard{cursor:pointer;transition:transform .12s,border-color .12s}.appcard:hover{transform:translateY(-2px);border-color:var(--line2)}
  .appname{font-size:16px;font-weight:750;color:#fff}.appstat{display:flex;gap:20px}.appstat .n{font-size:19px;font-weight:800}.appstat .t{font-size:10.5px;color:var(--muted);text-transform:uppercase}
  .hbar{display:flex;height:7px;border-radius:100px;overflow:hidden;background:var(--raise);margin:13px 0 10px}.hbar i{height:100%}
  .geochip{font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:100px;background:#15294a;color:#8fd4ff;margin-left:6px}.geochip.loc{background:var(--watch-b);color:var(--watch)}
  .verdict{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:12px;margin-bottom:14px}.verdict .big{font-size:19px;font-weight:800}
  .backlnk{display:inline-flex;align-items:center;gap:6px;color:var(--cyan);cursor:pointer;font-size:12.5px;font-weight:600;margin-bottom:14px}
  .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.kv:last-child{border-bottom:none}.kv .k{color:var(--muted)}.kv .v{font-weight:600}
  .meter{height:7px;background:var(--raise);border-radius:100px;overflow:hidden;width:70px}.meter i{display:block;height:100%}.meter.r i{background:var(--bad)}.meter.y i{background:var(--watch)}.meter.g i{background:var(--good)}
  .addbtn{border:1.5px dashed var(--line2);border-radius:13px;padding:20px;text-align:center;cursor:pointer;color:var(--cyan);font-weight:700;background:var(--panel2)}
  .note{background:#1a2540;border-left:3px solid var(--blue);border-radius:9px;padding:11px 14px;font-size:13px;color:#cdd8ee;margin:12px 0}
  .banner{padding:11px 16px;border-radius:10px;margin-bottom:14px;font-size:13.5px;font-weight:600}
  .banner.demo{background:var(--watch-b);color:var(--watch);border:1px solid #4a3a12}
  .banner.empty{background:var(--panel);color:var(--muted);border:1px solid var(--line2)}
  .lgd{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}.lgd span{display:inline-flex;align-items:center;gap:6px}.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
  .est{font-weight:800;color:var(--good)}svg.chart{width:100%;display:block}
  /* Overview layout grid — desktop unchanged: KPIs & note full width; chart|movers row, apps|attn row */
  .ov{display:grid;grid-template-columns:2fr 1fr;gap:14px}
  .ov-kpi{grid-column:1/-1;grid-row:1;margin:0}
  .ov-note{grid-column:1/-1;grid-row:2}
  .ov-chart{grid-column:1;grid-row:3}
  .ov-movers{grid-column:2;grid-row:3}
  .ov-apps{grid-column:1;grid-row:4}
  .ov-attn{grid-column:2;grid-row:4}
  .ov-chev{display:none}
  /* mobile menu button + drawer scrim (hidden on desktop) */
  .hamb{display:none;flex:none;align-items:center;justify-content:center;width:38px;height:38px;padding:0;border-radius:9px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);font-size:19px;cursor:pointer}
  .nav-scrim{display:none}
  /* ---------- TABLET ---------- */
  @media(max-width:760px){
    .app{display:block}
    aside{position:fixed;top:0;left:0;z-index:60;width:248px;height:100vh;transform:translateX(-100%);transition:transform .22s ease;will-change:transform}
    body.nav-open aside{transform:translateX(0);box-shadow:0 0 55px rgba(0,0,0,.6)}
    .nav-scrim{display:block;position:fixed;inset:0;z-index:55;background:rgba(3,7,18,.6);opacity:0;pointer-events:none;transition:opacity .22s}
    body.nav-open .nav-scrim{opacity:1;pointer-events:auto}
    .hamb{display:inline-flex}
    main{width:100%}
    .topbar{padding:9px 12px;gap:9px;flex-wrap:wrap}
    .topbar h1{font-size:15px}.topbar .sub{display:none}
    .topbar>div:first-of-type{flex:1 1 auto;min-width:0}
    .spacer{display:none}
    .topbar>label.ctrl,.topbar #rangecustom{flex:1 1 42%;min-width:0;justify-content:center}
    .topbar label.ctrl select{max-width:100%!important;width:100%}
    .content{padding:15px 12px 40px;max-width:100%}
    h2.sc{font-size:18px}
    .row.c2,.row.c3{grid-template-columns:1fr}
    .row.c4,.row.c5,.row.c6,.row.c7{grid-template-columns:1fr 1fr}
    .span2{grid-column:auto}
    .kpi .v{font-size:21px}
    th,td{padding:9px 10px}
    /* wide tables scroll INSIDE their card instead of squishing the page */
    .card.pad0{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .card.pad0 table{min-width:540px}
    .verdict{flex-wrap:wrap}
    .aval{min-width:70px}
    /* Overview mobile: stack KPIs(bigger) → apps → chart → movers/attn tap-strips */
    .ov{display:flex;flex-direction:column;gap:12px}
    .ov-kpi{order:1}.ov-apps{order:2}.ov-chart{order:3}.ov-movers{order:4}.ov-attn{order:5}.ov-note{order:6}
    /* KPIs stay 2-up on phones (bigger numbers). 3 classes so this still wins over the
       .row.c4/.c5 → 1-column rule in the ≤430px block below. With Ad spend that's 5 tiles,
       so the last one spans the full width instead of sitting alone in half. */
    .ov-kpi.row.c4,.ov-kpi.row.c5,.ov-kpi.row.c6,.ov-kpi.row.c7{grid-template-columns:1fr 1fr;gap:10px}
    .ov-kpi.row.c5>.kpi:nth-child(5){grid-column:1/-1}
    .ov-kpi.row.c7>.kpi:nth-child(7){grid-column:1/-1}
    .ov-kpi .kpi{padding:15px 13px}
    .ov-kpi .kpi .v{font-size:25px;margin-top:5px}
    .ov-kpi .kpi .l{font-size:11.5px}
    .ov-coll .ct{cursor:pointer;margin-bottom:0;user-select:none}
    .ov-coll .feed{display:none;margin-top:12px}
    .ov-coll.open .feed{display:grid}
    .ov-chev{display:inline-block;width:0;height:0;margin-left:auto;flex:none;border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid var(--muted);transition:transform .2s}
    .ov-coll.open .ov-chev{transform:rotate(180deg)}
  }
  /* ---------- PHONE ---------- */
  @media(max-width:430px){
    .row.c4,.row.c5{grid-template-columns:1fr}
    .kpi .v{font-size:22px}
    h2.sc{font-size:17px}
    .content{padding:13px 10px 36px}
    .topbar>label.ctrl,.topbar #rangecustom{flex:1 1 100%}
  }
  /* ===== mobile app-shell: fixed bottom tab bar + table→card-list. Desktop untouched. ===== */
  .botbar{display:none}
  .only-mob{display:none}
  @media(max-width:760px){
    .content{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
    .botbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(12,20,36,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom,0px))}
    .botbar .tabbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--faint);font-size:10.5px;font-weight:700;font-family:inherit;padding:4px 2px;cursor:pointer;position:relative}
    .botbar .tabbtn .ti{font-size:20px;line-height:1}
    .botbar .tabbtn.active{color:var(--cyan)}
    .botbar .tbadge{position:absolute;top:-3px;left:calc(50% + 5px);min-width:15px;height:15px;line-height:15px;text-align:center;background:var(--bad);color:#fff;border-radius:8px;font-size:9.5px;font-weight:800;padding:0 4px;display:none}
    .botbar .tbadge.on{display:block}
    .only-desk{display:none}
    .only-mob{display:block}
    .mlist{padding:2px 0 4px}
    .mrow{display:flex;align-items:center;gap:11px;padding:12px 15px;border-top:1px solid var(--line);cursor:pointer}
    .mrow:first-child{border-top:none}
    .mrow:active{background:var(--raise)}
    .mic{flex:none;display:grid;place-items:center}
    .mmid{flex:1;min-width:0}
    .mname{font-size:14px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mmeta{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mmeta .hs{width:26px;height:19px;font-size:10.5px;border-radius:6px;vertical-align:middle}
    .mright{text-align:right;flex:none}
    .mrev{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
    .mpl{font-size:12px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
    .mchev{color:var(--faint);font-size:20px;flex:none}
  }
  /* ===== Phase 3: touch polish + iOS/Android standalone (add-to-home-screen) ===== */
  body{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  @media(max-width:760px){
    .hamb{display:none}                                     /* bottom-bar "More" opens the nav drawer now */
    .topbar{padding-top:calc(9px + env(safe-area-inset-top,0px))}   /* clear the notch/status bar in standalone */
    .content{-webkit-overflow-scrolling:touch}
    tr.clk:active td{background:var(--raise)}
    .nav button:active{background:var(--raise)}
    .botbar .tabbtn:active{opacity:.55}
    .ctrl:active{background:var(--raise)}
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo">◈</div><div class="nm">AdMob IQ<small>Revenue Intelligence</small></div></div>
    <div class="nav-lbl">Analyse</div>
    <ul class="nav" id="nav">
      <li><button data-screen="overview" class="active"><span class="i">📊</span> Overview</button></li>
      <li><button data-screen="movers"><span class="i">📈</span> Movers</button></li>
      <li><button data-screen="alerts"><span class="i">🔔</span> Alerts <span class="badge" id="nav-alert">·</span></button></li>
      <li><button data-screen="deductions"><span class="i">📉</span> Deductions</button></li>
      <li><button data-screen="baseline"><span class="i">📐</span> Baseline</button></li>
      <li><button data-screen="mediation"><span class="i">🔗</span> Mediation</button></li>

<script>
const API_BASE = window.__API_BASE__ || "";

const CUR_SYM={USD:"$",INR:"₹",EUR:"€",GBP:"£",JPY:"¥",BRL:"R$",AUD:"A$",CAD:"C$",SGD:"S$"};

function _appIconUrl(name){ const m=(typeof DATA!=='undefined'&&DATA&&DATA.app_icons)||{};
  // Use the HIGHEST-REVENUE app_id for this name and ITS OWN icon (by app_id). Same app name can
  // exist under multiple app_ids/accounts — never borrow a same-named cousin's icon (that showed the
  // wrong logo). If this app's own icon didn't resolve, return null → clean letter-avatar.
  const cands=((typeof DATA!=='undefined'&&DATA&&DATA.apps_catalog)||[]).filter(x=>x.app_name===name).sort((a,b)=>(b.rev||0)-(a.rev||0));
  if(cands.length) return m[cands[0].app_id]||null;
  return m[name]||null; }
function _appIconColor(name){ const P=['#3dd0f0','#4ade80','#f0a63d','#a78bfa','#f472b6','#22d3ee','#fb923c','#60a5fa'];
  let h=0; for(let i=0;i<(name||'').length;i++)h=(h*31+name.charCodeAt(i))>>>0; return P[h%P.length]; }
function appIcon(name,size){ size=size||20; const rad=Math.max(4,Math.round(size*0.24)); const col=_appIconColor(name);
  const ch=((name||'?').trim().charAt(0)||'?').toUpperCase(); const url=_appIconUrl(name);
  const box=`display:inline-flex;align-items:center;justify-content:center;width:${size}px;height:${size}px;border-radius:${rad}px;vertical-align:middle;flex:none;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.06)`;
  if(url){ const fb=`this.parentNode.style.background='${col}22';this.parentNode.style.color='${col}';this.parentNode.style.fontWeight='800';this.parentNode.style.fontSize='${Math.round(size*0.5)}px';this.parentNode.textContent='${ch.replace(/[^A-Z0-9]/g,'')||'?'}'`;
    return `<span style="${box}"><img src="${url}" alt="" style="width:100%;height:100%;object-fit:cover" onerror="${fb}"></span>`; }
  return `<span style="${box};background:${col}22;color:${col};font-weight:800;font-size:${Math.round(size*0.5)}px">${ch}</span>`;
}

// ---- small chart helpers (compute from data) ----
function areaChart(values,w=620,h=140,color="#3dd0f0",grad="gA"){
  if(!values.length) return "";
  const pad=8,top=12,mn=Math.min(...values),mx=Math.max(...values),rng=(mx-mn)||1;
  const xs=values.map((_,i)=>pad+(w-2*pad)*i/Math.max(1,values.length-1));
  const ys=values.map(v=>top+(h-top-pad)*(1-(v-mn)/rng));
  const line="M"+xs.map((x,i)=>`${x.toFixed(1)} ${ys[i].toFixed(1)}`).join(" L");
  const area=`M${xs[0].toFixed(1)} ${h-pad} L`+xs.map((x,i)=>`${x.toFixed(1)} ${ys[i].toFixed(1)}`).join(" L")+` L${xs[xs.length-1].toFixed(1)} ${h-pad} Z`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:150px">
    <defs><linearGradient id="${grad}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".33"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${grad})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.3"/></svg>`;
}
function microbar(trend){
  const v=trend.slice(-6); if(!v.length) return "";
  const mn=Math.min(...v),mx=Math.max(...v),rng=(mx-mn)||1;
  const up=v[v.length-1]>=v[0]; const cls=up?"g":"r";
  return `<span class="microbar ${cls}">`+v.map(x=>`<i style="height:${(5+11*(x-mn)/rng).toFixed(0)}px"></i>`).join("")+`</span>`;
}
function sparkbars(trend,cls){
  const v=trend.slice(-7); if(!v.length) return "";
  const mn=Math.min(...v),mx=Math.max(...v),rng=(mx-mn)||1;
  return `<div class="spark ${cls||''}">`+v.map(x=>`<i style="height:${(25+75*(x-mn)/rng).toFixed(0)}%"></i>`).join("")+`</div>`;
}
function fmtVal(m,v){if(m==='match_rate'||m==='show_rate')return (v*100).toFixed(0)+'%';if(m==='ctr')return (v*100).toFixed(1)+'%';if(m==='ecpm'||m==='revenue')return '$'+v;return Number(v).toLocaleString();}
function filterAlerts(f){document.querySelectorAll('.screen[data-screen=alerts] .alert').forEach(c=>{const ms=(c.dataset.metrics||'').split(' ');c.style.display=(f==='all'||c.dataset.sev===f||ms.includes(f))?'':'none';});}
function filterPlDetail(f){document.querySelectorAll('#pl-detail tbody tr').forEach(r=>{if(r.classList.contains('grp')){r.style.display='';return;}let s=true;if(f==='improving')s=r.dataset.dir==='up';else if(f==='declining')s=r.dataset.dir==='down';else if(f!=='all')s=r.dataset.fmt===f;r.style.display=s?'':'none';});}

function screenDiv(id){const d=document.createElement('section');d.className='screen';d.dataset.screen=id;return d;}
function kpi(l,v,d,cls,spark){return `<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d ${cls||'muted'}">${d||''}</div>${spark||''}</div>`;}
function fmtD(s){const p=String(s||'').split('-');if(p.length<3)return s||'';const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return (+p[2])+' '+(mo[(+p[1])-1]||'');}
function rangeSpan(k){if(!k||!k.from||!k.to)return '';const f=fmtD(k.from),t=fmtD(k.to);return (k.from===k.to?f:f+'–'+t)+(k.days?` · ${k.days}d`:'');}
function fmtN(n){n=+n||0;if(n>=1e6)return (n/1e6).toFixed(1)+'M';if(n>=1e3)return (n/1e3).toFixed(1)+'k';return String(Math.round(n));}
// ---- App filter (real, client-side over the daily data each placement already carries) ----
function fPlace(){ return APP ? (DATA.placements||[]).filter(p=>p.app===APP) : (DATA.placements||[]); }
function appTrend(fp){ let n=0; fp.forEach(p=>n=Math.max(n,(p.trend||[]).length)); const out=Array(n).fill(0);
  fp.forEach(p=>{const t=p.trend||[]; for(let i=0;i<t.length;i++) out[n-t.length+i]+=t[i];}); return out.map(v=>Math.round(v*100)/100); }
function appRangeRev(fp,range){ if(range==='today') return fp.reduce((s,p)=>s+(p.today_revenue||0),0);
  const t=appTrend(fp); if(!t.length) return 0; if(range==='yesterday') return t[t.length-1];
  return t.slice(-(range==='30d'?30:7)).reduce((a,b)=>a+b,0); }
function appNote(){ return APP ? `<div class="card" style="margin-bottom:14px;border-color:#2b466f"><div class="muted" style="font-size:13px">📱 Filter: <b style="color:#fff">${APP}</b> — ye screen abhi portfolio-wide (saari apps) hai. Sirf is app ka data Overview, Placements, Movers aur Deductions me dikhta hai.</div></div>` : ''; }
function setApp(a){ const on=document.querySelector('.screen.on'); const cur=on?on.dataset.screen:'overview'; APP=a; render(); show(cur==='reportcard'?'placements':cur); window.scrollTo({top:0}); }
function searchCountries(q){ q=(q||'').trim().toUpperCase(); document.querySelectorAll('#cty-tbody tr').forEach((r,i)=>{ const n=(r.getAttribute('data-c')||'').toUpperCase(); r.style.display=(q?n.includes(q):i<30)?'':'none'; }); }

// ---- Placement time-window engine (per ad unit, over the raw daily counts each
// placement carries: [date, earn_micros, impr, req, matched, clicks]) ----
// Presets use COMPLETE days only (partial "today" excluded) so they match the AdMob
// app's "Last 7/30 days"; Today/Yesterday are explicit single days; Custom is literal.
function windowDates(axis, range, cf, ct){
  const T=DATA.today_date||"", L=DATA.latest_complete||"";
  if(range==='today')     return T?[T]:[];
  if(range==='yesterday') return L?[L]:(axis.length?[axis[axis.length-1]]:[]);
  if(range==='custom'){ const a=cf||"", b=ct||""; return axis.filter(d=>(!a||d>=a)&&(!b||d<=b)); }
  const comp = T ? axis.filter(d=>d!==T) : axis.slice();     // complete days = axis minus partial today
  if(range==='all')   return comp;
  if(range==='month'){ const mo=(L||(comp.length?comp[comp.length-1]:"")).slice(0,7); return comp.filter(d=>d.slice(0,7)===mo); }
  // Last month = the calendar month before the one we are IN, whole (1st to last day), so
  // month-on-month comparisons are apples-to-apples instead of "30 days back from today".
  // Anchored on today's DATE, not on the latest complete day: on the 1st of a month the latest
  // complete day still sits in the old month, and anchoring there would silently show the month
  // before last. (curWinLabel prints the actual dates, so which month it is stays visible.)
  if(range==='lastmonth'){
    const mo=(T||L||(comp.length?comp[comp.length-1]:"")).slice(0,7); if(!mo) return [];
    const y=+mo.slice(0,4), m=+mo.slice(5,7);
    const prev = m>1 ? y+'-'+String(m-1).padStart(2,'0') : (y-1)+'-12';
    return comp.filter(d=>d.slice(0,7)===prev);
  }
  const n = range==='7d'?7:range==='30d'?30:range==='90d'?90:7;
  return comp.slice(-n);
}
function sumDaily(daily, winSet){
  let e=0,im=0,rq=0,ma=0,ck=0;
  (daily||[]).forEach(r=>{ if(winSet.has(r[0])){ e+=r[1]; im+=r[2]; rq+=r[3]; ma+=r[4]; ck+=r[5]; } });
  return {revenue:e/1e6, earn:e, impr:im, req:rq, matched:ma, clicks:ck,
          ecpm: im? e/(im*1000) : 0, match: rq? Math.min(1, ma/rq) : 0,
          // show rate = impr/matched; impr is mediation (all sources), matched is network,
          // so the cross-source ratio can nudge >100% — cap at 100% (its conceptual ceiling).
          show: ma? Math.min(1, im/ma) : 0, ctr: im? ck/im : 0};
}
function pRangeLabel(r){return {today:'Today',yesterday:'Yesterday','7d':'7 days','30d':'30 days','90d':'90 days',month:'This month',lastmonth:'Last month',all:'All time',custom:'Custom'}[r]||r;}
// portfolio calendar axis (all placement dates), cached; invalidated each render()
function gAxis(){ if(window.__ax) return window.__ax; window.__ax=[...new Set((DATA.placements||[]).flatMap(p=>(p.daily||[]).map(r=>r[0])))].sort(); return window.__ax; }
function curWinArr(){ const ax=gAxis(); let cf=RCUSTOM.from,ct=RCUSTOM.to;
  if(RANGE==='custom'){ if(!cf)cf=(ax.length>30?ax[ax.length-30]:ax[0]||''); if(!ct)ct=(DATA.latest_complete||ax[ax.length-1]||''); }
  return windowDates(ax, RANGE, cf, ct); }
function curWin(){ return new Set(curWinArr()); }
function curWinLabel(){ const w=curWinArr(); if(!w.length) return 'is range me data nahi'; const a=w[0],b=w[w.length-1];
  return (a===b?fmtD(a):fmtD(a)+'–'+fmtD(b))+' · '+w.length+'d'+(RANGE==='today'?' · live':''); }
// re-render everything for the new window, then restore whatever the user was looking at
function rerender(){ const on=document.querySelector('.screen.on'); const cur=on?on.dataset.screen:'overview';
  render();
  if(cur==='reportcard'&&PPID) goPlacement(PPID);
  else if(cur==='appdetail'&&ADAPP) openAppDetail(ADAPP);

function applyRangeCustom(){ const f=document.getElementById('rc-from'),t=document.getElementById('rc-to');
  if(f&&t){ RCUSTOM={from:f.value||"",to:t.value||""}; RANGE='custom'; rerender(); } }

function render(){
  window.__ax=null;              // invalidate the cached calendar axis (data may have changed)
  const root=document.getElementById('screens');root.innerHTML='';
  root.append(renderOverview(),renderPlacements(),renderReport(),renderAppDetail(),renderMovers(),renderAlerts(),
              renderDeductions(),renderCountries(),renderBaseline(),renderMediation(),renderRoas(),renderReco(),renderHealth(),renderSettings());
  const c=DATA.alerts.counts;document.getElementById('nav-alert').textContent=(c.critical||0)+(c.warning||0)+((DATA.range_alerts||[]).length);
  {const _tb=document.getElementById('tab-alert');if(_tb){const _n=(c.critical||0)+(c.warning||0)+((DATA.range_alerts||[]).length);_tb.textContent=_n;_tb.classList.toggle('on',_n>0);}}
  const sel=document.getElementById('appsel');
  const _vapps=(DATA.apps||[]).filter(a=>appVisibleByName(a.name));   // hide unselected apps from the filter
  if(sel) sel.innerHTML='<option value="">All apps ('+_vapps.length+')</option>'+_vapps.map(a=>`<option value="${a.name}"${a.name===APP?' selected':''}>${a.name}</option>`).join('');
  const rsel=document.getElementById('rangesel'); if(rsel) rsel.value=RANGE;
  const rcust=document.getElementById('rangecustom'); if(rcust) rcust.style.display=(RANGE==='custom'?'inline-flex':'none');
  if(!window.__wired){            // attach static listeners once (survives auto-refresh re-renders)
    window.__wired=true;

    const sel0=document.getElementById('appsel'); if(sel0) sel0.addEventListener('change',e=>setApp(e.target.value));

  }
  const bn=document.getElementById('banner');
  if(bn){
    if(DATA.is_demo){ bn.innerHTML='<div class="banner demo">🧪 SAMPLE DATA — ye demo numbers hain. Setup poora hone ke baad yahan aapka asli AdMob data aa jayega.</div>'; }
    else if(DATA.empty){ bn.innerHTML='<div class="banner empty">⏳ Abhi koi data nahi aaya. Pehle sync ke baad (ya AdMob me is duration ki earning aane par) yahan dikh jayega.</div>'; }
    else { bn.innerHTML=''; }
  }

  show('overview');
}
// ---- live freshness + auto-refresh ----
function relTime(iso){
  if(!iso) return null;
  const t=new Date(iso).getTime(); if(isNaN(t)) return null;
  const s=Math.max(0,Math.floor((Date.now()-t)/1000));
  if(s<90) return "abhi update hua";
  const m=Math.floor(s/60); if(m<60) return m+" min pehle";
  const h=Math.floor(m/60); if(h<24) return h+" ghante pehle";
  return Math.floor(h/24)+" din pehle";
}
function updateFreshness(){
  const el=document.getElementById('fresh-txt'); if(!el) return;
  const r=relTime(DATA&&DATA.generated_at);
  el.textContent = r ? r : "Live";
  const tz=document.getElementById('tzchip'), tzt=document.getElementById('tz-txt');
  if(tz&&tzt&&DATA&&DATA.report_tz_label){ tzt.textContent=DATA.report_tz_label; tz.style.display='inline-flex'; }
}
async function refreshData(){
  const active=document.querySelector('.screen.on');
  const cur=active?active.dataset.screen:'overview';
  try{
    const url=(window.__DATA_URL__||"dashboard.json")+"?t="+Date.now();   // cache-bust for freshness
    let r=await fetch(url,{cache:"no-store"}); if(!r.ok){ r=await fetch(API_BASE+"/dashboard",{cache:"no-store"}); }
    DATA=await r.json();
    render();
    if(cur && cur!=='overview' && cur!=='reportcard') show(cur);          // stay where the user was
  }catch(e){ updateFreshness(); }                                          // network blip: keep last good data
}
function setRange(r){
  RANGE=r;

// ===== App-report DAILY metric panel (metric chips + low/high/avg + hover) — app-level, from
// each placement's per-day raw counts (no extra AdMob call; rates recomputed from summed counts). =====
function adDailySeries(appName){
  const ps=(DATA.placements||[]).filter(p=>p.app===appName);
  const byDay={};
  ps.forEach(p=>(p.daily||[]).forEach(r=>{ const o=byDay[r[0]]=byDay[r[0]]||{e:0,i:0,q:0,m:0,c:0};
    o.e+=r[1]||0; o.i+=r[2]||0; o.q+=r[3]||0; o.m+=r[4]||0; o.c+=r[5]||0; }));
  const d=Object.keys(byDay).sort();
  const rev=[],ecpm=[],ctr=[],match=[],show=[],req=[];
  d.forEach(x=>{ const o=byDay[x];
    rev.push(o.e/1e6); req.push(o.q);
    ecpm.push(o.i? o.e/(o.i*1000) : null);              // rates blank on 0-impression days
    ctr.push(o.i? o.c/o.i : null);
    match.push(o.q? Math.min(1,o.m/o.q) : null);
    show.push(o.m? Math.min(1,o.i/o.m) : null); });
  return {d,rev,ecpm,ctr,match,show,req};
}

  const days=ADRANGE==='90d'?90:30; for(let i=Math.max(0,n-days);i<n;i++)idx.push(i); return idx; }

// windowed revenue chart: area of daily $ + dashed baseline (7-day median) + end dot
function trendChart(pts, base, color){
  if(!pts||!pts.length) return '';
  const w=620,h=150,pad=8,top=16;color=color||'#3dd0f0';
  const vals=pts.map(p=>p.v);
  const mx=Math.max(...vals, base||0), mn=0, rng=(mx-mn)||1;
  const X=i=>pad+(w-2*pad)*i/Math.max(1,pts.length-1);
  const Y=v=>top+(h-top-pad)*(1-(v-mn)/rng);
  const pathPts=pts.map((p,i)=>`${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' L');
  const area=`M${X(0).toFixed(1)} ${(h-pad).toFixed(1)} L${pathPts} L${X(pts.length-1).toFixed(1)} ${(h-pad).toFixed(1)} Z`;
  const by=base!=null&&base>0?Y(base).toFixed(1):null;
  const lx=X(pts.length-1).toFixed(1), ly=Y(pts[pts.length-1].v).toFixed(1);
  const dots=pts.length<=10?pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.6" fill="${color}"/>`).join(''):'';
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:160px">
    <defs><linearGradient id="gTC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".30"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#gTC)"/><path d="M${pathPts}" fill="none" stroke="${color}" stroke-width="2.3"/>
    ${by?`<line x1="${pad}" y1="${by}" x2="${w-pad}" y2="${by}" stroke="#8496b5" stroke-width="1.4" stroke-dasharray="5 5"/>`:''}
    ${dots}<circle cx="${lx}" cy="${ly}" r="4" fill="${color}"/></svg>`;
}
// "YYYY-MM" -> "Oct '25"
function bMon(m){ if(!m||m.length<7)return m||''; const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; const p=m.split('-'); return (MO[(+p[1])-1]||p[1])+" '"+p[0].slice(2); }
// Informative trend chart: Y value scale + X month labels + dots (hover = month · value) + last value called out.
function bTrendChart(months, values, opts){
  opts=opts||{}; const fmt=opts.fmt||(v=>''+v); const col=opts.color||'#3dd0f0'; const xlab=opts.xlab||bMon;
  const n=(months||[]).length; if(!n) return '<div class="muted" style="font-size:12px;padding:14px 4px">Trend data nahi</div>';
  const W=1000,H=260,mL=56,mR=18,mT=16,mB=30, pw=W-mL-mR, ph=H-mT-mB;
  const vals=values.map(v=>+v||0); const vmax=(Math.max(...vals,0)*1.08)||1, vmin=0;
  const xi=i=> mL + (n<=1? pw/2 : pw*i/(n-1));
  const yv=v=> mT + ph*(1-(v-vmin)/((vmax-vmin)||1));
  const line=vals.map((v,i)=>`${xi(i).toFixed(1)} ${yv(v).toFixed(1)}`).join(' L');
  const area=`M${xi(0).toFixed(1)} ${(mT+ph).toFixed(1)} L${line} L${xi(n-1).toFixed(1)} ${(mT+ph).toFixed(1)} Z`;
  let grid='';
  for(let k=0;k<=4;k++){ const v=vmax*k/4, y=yv(v).toFixed(1);
    grid+=`<line x1="${mL}" y1="${y}" x2="${W-mR}" y2="${y}" stroke="#22314f" stroke-width="1"/>`
        + `<text x="${mL-9}" y="${(+y+4).toFixed(1)}" text-anchor="end" font-size="13" fill="#8496b5">${fmt(v)}</text>`; }
  const step=Math.max(1,Math.ceil(n/8)); let xl='';
  for(let i=0;i<n;i++){ if(i%step!==0 && i!==n-1) continue; const x=xi(i).toFixed(1);
    xl+=`<line x1="${x}" y1="${mT+ph}" x2="${x}" y2="${mT+ph+4}" stroke="#3a4a66" stroke-width="1"/>`
      + `<text x="${x}" y="${H-9}" text-anchor="middle" font-size="12.5" fill="#8496b5">${xlab(months[i])}</text>`; }
  const dots=vals.map((v,i)=>`<circle cx="${xi(i).toFixed(1)}" cy="${yv(v).toFixed(1)}" r="${n>28?2.2:3}" fill="${col}"><title>${xlab(months[i])} · ${fmt(v)}</title></circle>`).join('');
  const li=n-1, lx=xi(li), ly=yv(vals[li]);
  const last=`<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4.5" fill="${col}"/><text x="${(lx-7).toFixed(1)}" y="${(Math.max(ly-9,14)).toFixed(1)}" text-anchor="end" font-size="14" font-weight="700" fill="#eaf6ff">${fmt(vals[li])}</text>`;

// interactive tooltip for every bTrendChart: nearest-point snap with guide line, dot + value label
function bChartHover(ev,ov){ const svg=ov.ownerSVGElement; if(!svg)return;
  let pts; try{pts=JSON.parse(svg.getAttribute('data-pts')||'[]');}catch(e){return;} if(!pts.length)return;
  const r=ov.getBoundingClientRect(); const mL=+ov.getAttribute('x'), pw=+ov.getAttribute('width');
  const frac=r.width?Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width)):0; const vbX=mL+frac*pw;
  let best=pts[0],bd=1e9; for(const p of pts){const d=Math.abs(p.x-vbX); if(d<bd){bd=d;best=p;}}
  const W=(svg.viewBox&&svg.viewBox.baseVal&&svg.viewBox.baseVal.width)||1000;
  const g=svg.querySelector('.bcg'); if(g){g.setAttribute('x1',best.x);g.setAttribute('x2',best.x);g.style.visibility='visible';}
  const dot=svg.querySelector('.bch'); if(dot){dot.setAttribute('cx',best.x);dot.setAttribute('cy',best.y);dot.style.visibility='visible';}
  const tg=svg.querySelector('.bct'); if(tg){ const bg=tg.querySelector('.bctbg'), tx=tg.querySelector('.bcttx');
    const s=best.l+'  ·  '+best.v; tx.textContent=s; const tw=s.length*7.2+18;
    let x=best.x-tw/2; x=Math.max(3,Math.min(x,W-tw-3)); let y=best.y-31; if(y<2)y=best.y+9;
    bg.setAttribute('x',x);bg.setAttribute('y',y);bg.setAttribute('width',tw);
    tx.setAttribute('x',x+9);tx.setAttribute('y',y+16); tg.style.visibility='visible'; }
}
function bChartLeave(ov){ const svg=ov.ownerSVGElement; if(!svg)return; ['.bcg','.bch','.bct'].forEach(s=>{const el=svg.querySelector(s); if(el)el.style.visibility='hidden';}); }
// app-level "where did the drop concentrate" — window vs the equal prior window, per country
function dropByCountry(app, winArr){
  const cd=(DATA.countries_daily||{})[app]; if(!cd||!winArr||!winArr.length) return null;
  const winSet=new Set(winArr), n=winArr.length;
  const comp=gAxis().filter(d=>d!==(DATA.today_date||''));
  const wi=comp.indexOf(winArr[0]);
  const prior=(wi>0)?comp.slice(Math.max(0,wi-n),wi):[];
  if(!prior.length) return null;
  const priorSet=new Set(prior); const rows=[];
  Object.keys(cd).forEach(c=>{let cur=0,pre=0;cd[c].forEach(r=>{if(winSet.has(r[0]))cur+=r[1];if(priorSet.has(r[0]))pre+=r[1];});
    if(pre>0) rows.push({country:c,cur:cur/1e6,pre:pre/1e6,drop:(pre-cur)/1e6,pct:(pre-cur)/pre});});
  rows.sort((a,b)=>b.drop-a.drop);
  const totalDrop=rows.reduce((s,r)=>s+Math.max(0,r.drop),0);
  return {rows, totalDrop};
}

function renderMovers(){
  const s=screenDiv('movers');
  // Rank by REAL $ impact (money moved), not raw % — a +1258% jump on $1 is noise; a −$500 drop
  // on a big earner is what matters. Compare last 7 COMPLETE days vs the prior 7 (WoW), from each
  // placement's per-day counts. Today (partial) is excluded so it's a fair complete-vs-complete read.
  const comp=gAxis().filter(d=>d!==(DATA.today_date||''));
  const curSet=new Set(comp.slice(-7)), prevSet=new Set(comp.slice(-14,-7));
  const revCell=(v)=>{const a=Math.abs(v); return a>=10?money(a):csym()+a.toFixed(2);};   // always abs; caller adds the sign
  const pls=(DATA.placements||[]).filter(p=>!APP||p.app===APP);
  const data=pls.map(p=>{ let c=0,pr=0; (p.daily||[]).forEach(r=>{ if(curSet.has(r[0]))c+=r[1]; if(prevSet.has(r[0]))pr+=r[1]; });
    c/=1e6; pr/=1e6; const d=c-pr; return {p,cur:c,prev:pr,delta:d,pct:pr>0?d/pr:(c>0?null:0)}; });
  const totWk=data.reduce((a,x)=>a+x.cur,0);
  const MIN=Math.max(1,totWk*0.001);                       // ignore sub-0.1%-of-portfolio (min $1/wk) noise
  const movers=data.filter(x=>Math.abs(x.delta)>=MIN);
  const gain=movers.filter(x=>x.delta>0).sort((a,b)=>b.delta-a.delta);
  const loss=movers.filter(x=>x.delta<0).sort((a,b)=>a.delta-b.delta);
  const totGain=gain.reduce((a,x)=>a+x.delta,0), totLoss=loss.reduce((a,x)=>a+x.delta,0);
  const pctTxt=x=>x.pct==null?'naya':((x.pct>=0?'+':'−')+Math.round(Math.abs(x.pct)*100)+'%');
  const row=(x,i,cls)=>{ const f=x.p;
    return `<div onclick="goPlacement('${f.id||''}')" style="display:flex;align-items:center;gap:10px;padding:9px 6px;border-top:1px solid var(--line);cursor:pointer">

      <span class="hs ${f.band}">${f.health}</span>
      <div style="flex:1;min-width:0"><div style="font-weight:650;font-size:13px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</div><div class="faint" style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.app||''}${f.format?' · '+f.format:''}</div></div>
      ${microbar(f.trend||[])}
      <div style="text-align:right;min-width:120px">
        <div class="${cls}" style="font-weight:800;font-size:14px">${x.delta>=0?'+':'−'}${revCell(x.delta)}</div>
        <div class="faint" style="font-size:10.5px">${pctTxt(x)} WoW · ab ${revCell(x.cur)}/wk</div></div></div>`; };
  const CAP=25;
  const listOf=(arr,cls,none)=>arr.length?arr.slice(0,CAP).map((x,i)=>row(x,i,cls)).join('')+(arr.length>CAP?`<div class="faint" style="font-size:11px;padding:8px 6px 0">+${arr.length-CAP} aur chhote…</div>`:''):`<div class="muted" style="font-size:13px;padding:10px 6px">${none}</div>`;
  const bigStr=(()=>{ const g=gain[0],l=loss[0]; if(!g&&!l)return '—'; if(g&&(!l||g.delta>=Math.abs(l.delta)))return g.p.name; return l.p.name; })();
  const bigDelta=(()=>{ const g=gain[0],l=loss[0]; if(!g&&!l)return ''; if(g&&(!l||g.delta>=Math.abs(l.delta)))return '+'+revCell(g.delta)+'/wk'; return '−'+revCell(l.delta)+'/wk'; })();
  s.innerHTML=`<h2 class="sc">Movers${APP?' · '+APP:''}</h2>
    <p class="scd">Sabse zyada <b>$ move</b> karne wale placements — <b>last 7 poore din vs pichhle 7</b> (WoW). Sabse bada asar sabse upar. Noise (portfolio ka &lt;0.1% ya &lt;${revCell(MIN)}/wk) hata diya. Row → report card.</p>
    <div class="row c4" style="margin-bottom:14px">
      ${kpi('📈 Gained',totGain?'+'+revCell(totGain):'—',gain.length+' placements ↑',totGain?'up':'muted')}
      ${kpi('📉 Lost',totLoss?'−'+revCell(totLoss):'—',loss.length+' placements ↓',totLoss?'down':'muted')}
      ${kpi('Net WoW',(totGain+totLoss>=0?'+':'−')+revCell(totGain+totLoss),'is window ka',totGain+totLoss>=0?'up':'down')}
      ${kpi('Biggest mover',bigStr,bigDelta,'muted')}</div>
    <div class="row c2">
      <div class="card pad0"><div class="ct" style="padding:15px 16px 0"><h3 style="color:var(--good)">📈 Gainers (${gain.length})</h3><span class="faint" style="font-size:11px">$ badha · WoW</span></div><div style="padding:2px 10px 10px">${listOf(gain,'up','Is window me koi material gainer nahi.')}</div></div>

  return s;
}

  const pctTxt=((a.min_share||0.005)*100).toFixed(1)+'%';

// ---------- DEDUCTIONS (DATE → app → ad-unit → country drill; 'pehle itna → ab itna') ----------
let DED=null, DEDLOADING=false;              // per-unit estimate decay — lazy from deductions_daily.json
let DEDDATE=null, DEDAPP=null, DEDUNIT=null; // drill state: date → app → ad-unit
function loadDED(cb){ if(DED){cb&&cb();return;} if(DEDLOADING)return; DEDLOADING=true;
  fetch('deductions_daily.json?t='+Date.now()).then(r=>r.ok?r.json():null).then(j=>{DED=j||{dates:[],units:{},data:{}};DEDLOADING=false;cb&&cb();}).catch(()=>{DEDLOADING=false;}); }
function dedRerender(){ const old=document.querySelector('.screen[data-screen=deductions]'); if(old){const f=renderDeductions(); if(old.classList.contains('on'))f.classList.add('on'); old.replaceWith(f);} }
function dedOpenDate(d){ DEDDATE=d; DEDAPP=null; DEDUNIT=null; dedRerender(); }
function dedOpenApp(a){ DEDAPP=a; DEDUNIT=null; dedRerender(); }
function dedOpenUnit(u){ DEDUNIT=u; if(ACD===null&&!ACDLOADING) loadACD(()=>dedRerender()); dedRerender(); }
function dedBack(){ if(DEDUNIT)DEDUNIT=null; else if(DEDAPP)DEDAPP=null; else DEDDATE=null; dedRerender(); }
const _dcur=(v)=>{v=(+v||0)/1e6; return v>=10?money(v):csym()+v.toFixed(2);};   // micros → money (compact, for KPIs)
const _dm=(v)=>csym()+((+v||0)/1e6).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});  // exact 2-dp so pehle − ab === deduction in every row
const _dpct=(f,l)=>f>0?(f-l)/f:0;
// day-indices of DED.dates that fall inside the top-bar selected window (deduction is sparse, so
// we window by INTERSECTION — show whatever decayed within the chosen period).
function dedWin(){ const winSet=new Set(curWinArr()), keep=new Set(); const dts=[];
  (DED&&DED.dates||[]).forEach((d,i)=>{ if(winSet.has(d)){keep.add(i);dts.push(d);} }); return {keep,dates:dts}; }
function _dedVis(an){ return appVisibleByName(an) && (!APP || an===APP); }
// total CURRENT (ab) day revenue per date-string, from placements' daily (visible apps / APP filter)
function dedDayRevenue(){ const ab={};
  (DATA.placements||[]).forEach(p=>{ if(!_dedVis(p.app))return; (p.daily||[]).forEach(r=>{ ab[r[0]]=(ab[r[0]]||0)+(r[1]||0); }); }); return ab; }
// LEVEL 0 rows: one per date in-window that had a real deduction — {di,date,ded,ab,pehle,apps}. Newest first.
function dedDateRows(keep){ const abByDate=dedDayRevenue(), agg={};
  Object.keys(DED.data||{}).forEach(uid=>{ const an=(DED.units[uid]||{}).app_name||uid; if(!_dedVis(an))return;
    DED.data[uid].forEach(r=>{ if(keep.has(r[0])&&r[1]>r[2]){ const g=agg[r[0]]||(agg[r[0]]={ded:0,apps:new Set()}); g.ded+=r[1]-r[2]; g.apps.add(an); } }); });
  const out=[]; Object.keys(agg).forEach(k=>{ const di=+k,ded=agg[k].ded; if(ded<=0)return; const date=DED.dates[di],ab=abByDate[date]||0; out.push({di,date,ded,ab,pehle:ab+ded,apps:agg[k].apps.size}); });
  out.sort((a,b)=>a.date<b.date?1:-1); return out; }                       // newest date on top
// LEVEL 1: apps that decayed on ONE date (affected pehle/ab) — sorted by $ desc
function dedAppsForDate(di){ const byApp={};
  Object.keys(DED.data||{}).forEach(uid=>{ const an=(DED.units[uid]||{}).app_name||uid; if(!_dedVis(an))return;
    DED.data[uid].forEach(r=>{ if(r[0]===di&&r[1]>r[2]){ const g=byApp[an]||(byApp[an]={app:an,first:0,latest:0,ded:0,units:0}); g.first+=r[1];g.latest+=r[2];g.ded+=r[1]-r[2];g.units++; } }); });
  return Object.values(byApp).sort((x,y)=>y.ded-x.ded); }
// LEVEL 2: ad-units that decayed on ONE date for ONE app
function dedUnitsForDate(di,app){ const out=[];
  Object.keys(DED.data||{}).forEach(uid=>{ if(((DED.units[uid]||{}).app_name||uid)!==app)return;
    (DED.data[uid]||[]).forEach(r=>{ if(r[0]===di&&r[1]>r[2]) out.push({uid,name:(DED.units[uid]||{}).unit_name||uid,first:r[1],latest:r[2],ded:r[1]-r[2]}); }); });
  return out.sort((x,y)=>y.ded-x.ded); }
function dedCell(uid,di){ let f=0,l=0; (DED.data[uid]||[]).forEach(r=>{ if(r[0]===di){f+=r[1];l+=r[2];} }); return {first:f,latest:l,ded:f-l}; }
// Attribute a unit's deduction across its countries by that unit's revenue share (from acd) on the
// SAME date(s). AdMob doesn't split deduction by geo, so this is a revenue-weighted estimate —
// labelled as such, never presented as an exact AdMob per-country number.
function dedUnitCountries(uid,dedDates,unitDedMicros){
  if(!ACD||!ACD.data||!ACD.data[uid]||!unitDedMicros) return {rows:[],have:false};
  const dset=new Set(dedDates), keep=new Set(); (ACD.dates||[]).forEach((d,i)=>{ if(dset.has(d))keep.add(i); });
  if(!keep.size) return {rows:[],have:false};
  const rec=ACD.data[uid]; let tot=0; const c=[];
  Object.keys(rec).forEach(country=>{ let ea=0; rec[country].forEach(r=>{ if(keep.has(r[0]))ea+=r[5]; }); if(ea>0){tot+=ea;c.push({country,rev:ea});} });
  if(!tot) return {rows:[],have:false};
  c.forEach(x=>{ x.share=x.rev/tot; x.dedMicros=unitDedMicros*x.share; }); c.sort((a,b)=>b.dedMicros-a.dedMicros);
  return {rows:c,have:true}; }
// Flag = deduction RATE, but the loud red is reserved for high-rate AND material-$ (so a $14 app
// doesn't scream louder than a $3,798 one). High-rate-but-tiny-$ gets an honest amber, not red.
function dedIvtPill(pctv,dedMicros){ const material=(dedMicros||0)>=20e6;
  if(pctv>=0.15&&material) return '<span class="pill p-r" style="font-size:10px">🚨 IVT risk</span>';
  if(pctv>=0.15) return '<span class="pill p-y" style="font-size:10px">high % · chhota $</span>';
  if(pctv>=0.05) return '<span class="pill p-y" style="font-size:10px">watch</span>';
  return '<span class="pill p-g" style="font-size:10px">normal</span>'; }
const _dedBackBtn=(lbl)=>`<button class="lnk" onclick="dedBack()" style="background:none;border:none;color:var(--cyan);cursor:pointer;font:inherit;font-size:13px;padding:0;margin-bottom:10px">← ${lbl}</button>`;

function dedPeriodBar(){   // deduction window quick-pick, at the top of the tab. "All time" = full history.
  const opts=[['7d','7 days'],['30d','30 days'],['90d','90 days'],['month','This month'],['all','All time']];
  const btns=opts.map(([v,t])=>{const on=RANGE===v;return `<button onclick="setRange('${v}')" style="border:1px solid ${on?'var(--cyan)':'var(--line2)'};background:${on?'rgba(61,208,240,.14)':'var(--panel)'};color:${on?'#fff':'var(--ink2)'};font:inherit;font-weight:650;font-size:12.5px;padding:6px 13px;border-radius:8px;cursor:pointer">${t}</button>`;}).join('');
  return `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px"><span class="muted" style="font-size:12px;font-weight:600">🗓 Deduction period:</span>${btns}</div>`;
}

    s.innerHTML=head+_dedBackBtn(`${fmtD(DEDDATE)} · ${effApp}`)+

    s.innerHTML=head+_dedBackBtn(APP?fmtD(DEDDATE):`${fmtD(DEDDATE)} ki apps`)+
      `<div class="card" style="margin-bottom:14px"><div class="ct"><h3>${appIcon(effApp,22)}${effApp} <span class="faint" style="font-weight:400;font-size:12px">· ${fmtD(DEDDATE)}</span></h3><span class="muted" style="font-size:12px">ad-unit pe click → country</span></div>

function loadMED(cb){ if(MED){cb&&cb();return;} if(MEDLOADING)return; MEDLOADING=true;
  fetch('mediation_daily.json?t='+Date.now()).then(r=>r.ok?r.json():null).then(j=>{MED=j||{dates:[],names:{},by_app:{}};MEDLOADING=false;cb&&cb();}).catch(()=>{MEDLOADING=false;}); }

// Collapse windowed per-source sums [rev_micros,impr,matched,req] → the SAME row shape the engine
// ships (mirrors dataservice._mediation_rows): fill, eCPM, revenue, share, status.
function _medRowsFrom(bySrc){
  const names=(MED&&MED.names)||{};
  const out=Object.keys(bySrc).map(k=>{ const v=bySrc[k]; const rev=v[0]/1e6;
    const fill=v[3]?Math.round(v[2]/v[3]*100)/100:0;
    return {ad_source:names[k]||k, fill:fill, ecpm:v[1]?rev/v[1]*1000:0, revenue:rev,
            rev_share:0, status:(v[3]&&fill<0.5)?'low fill':'ok'}; });
  out.sort((a,b)=>b.revenue-a.revenue);
  const tot=out.reduce((s,r)=>s+r.revenue,0)||1; out.forEach(r=>r.rev_share=r.revenue/tot);
  return out; }
function _medSummary(rows){ if(!rows.length)return{networks:0,bidding_share:0,blended_fill:0,best_ecpm:null};
  const tot=rows.reduce((s,r)=>s+r.revenue,0)||1; let best=rows[0]; rows.forEach(r=>{if(r.ecpm>best.ecpm)best=r;});
  return {networks:rows.length, bidding_share:0, blended_fill:rows.reduce((s,r)=>s+r.fill*r.revenue,0)/tot,
          best_ecpm:{ad_source:best.ad_source, ecpm:best.ecpm}}; }
// Window the daily-by-source mediation to the SELECTED period. Returns {port, byApp} when the whole
// window sits inside mediation history, else null → caller falls back to the lifetime aggregate.
function medWindow(){
  if(!MED||!(MED.dates||[]).length||!MED.by_app) return null;
  const winArr=curWinArr(); if(!winArr.length) return null;
  const d0=MED.dates[0], dN=MED.dates[MED.dates.length-1];
  if(!winArr.every(d=>d>=d0&&d<=dN)) return null;                 // window not fully covered → lifetime
  const winSet=new Set(winArr), keep=new Set();
  MED.dates.forEach((d,i)=>{ if(winSet.has(d))keep.add(i); });
  const byApp={}, port={};
  Object.keys(MED.by_app).forEach(app=>{ const srcs=MED.by_app[app], appSrc={};
    Object.keys(srcs).forEach(k=>{ let rev=0,im=0,ma=0,rq=0;
      srcs[k].forEach(r=>{ if(keep.has(r[0])){ rev+=r[1]; im+=r[2]; ma+=r[3]; rq+=r[4]; } });
      if(rev||im||rq){ appSrc[k]=[rev,im,ma,rq]; const p=port[k]||(port[k]=[0,0,0,0]); p[0]+=rev;p[1]+=im;p[2]+=ma;p[3]+=rq; } });
    if(Object.keys(appSrc).length) byApp[app]={rows:_medRowsFrom(appSrc)};
  });
  return {port, byApp};
}

function renderReco(){
  const s=screenDiv('reco');const r=DATA.recommendations||{items:[],root_cause:[]};
  const comp=gAxis().filter(d=>d!==(DATA.today_date||''));
  const wkSet=new Set(comp.slice(-7)); const stakeLbl='last 7 din';   // stable weekly $ — recs = ongoing revenue, not aaj ka partial
  const baseName=(s)=>String(s||'').replace(/\s*\([^)]*\)\s*$/,'').trim();   // rec "place" = "name (App)" → strip to match
  const findPl=(placeStr,app)=>{const b=baseName(placeStr);const c=(DATA.placements||[]).filter(p=>p.name===b);return c.length<=1?c[0]:(c.find(p=>p.app===app)||c[0]);};
  const revOf=(placeStr,app)=>{const p=findPl(placeStr,app); return p?sumDaily(p.daily,wkSet).revenue:0;};
  const idOf=(placeStr,app)=>{const p=findPl(placeStr,app); return p?p.id:'';};
  const revCell=(v)=>v>=10?money(v):csym()+(+v).toFixed(2);
  // Build UNIFIED, grouped, $-ranked recommendation cards from every signal we already have —
  // instead of 200 identical rows. Each card = one action, its affected placements ranked by the
  // money at stake, total $ impact, and why. (No extra fetch — all from shipped data.)
  const cards=[];
  // 1) engine recs (mostly low-fill → mediation/bidding) grouped by action
  const items=(r.items||[]).filter(x=>!APP||x.app===APP);
  const byAction={}; items.forEach(x=>{(byAction[x.action]=byAction[x.action]||[]).push(x);});
  Object.entries(byAction).forEach(([action,arr])=>{
    const rows=arr.map(x=>({place:x.place,sub:x.reason||'',rev:revOf(x.place,x.app),id:idOf(x.place,x.app),goto:'placement'})).sort((a,b)=>b.rev-a.rev);
    cards.push({action, conf:arr[0].confidence||'high', ab:arr[0].ab,
      why:'Demand leak — mediation networks / bidding on karo taaki fill aur competition badhe (revenue chhut raha hai).',
      rows, total:rows.reduce((a,x)=>a+x.rev,0)});
  });
  // 2) approved-range breaches → investigate
  const ra=(DATA.range_alerts||[]).filter(x=>!APP||x.app===APP);
  if(ra.length) cards.push({action:'Approved range se bahar — investigate', conf:'high',
    why:'Ye placements apni "normal" range se hile — floor / demand / mediation / quality check karo.',
    rows: ra.map(a=>({place:a.place,sub:a.message||'',rev:revOf(a.place,a.app),id:a.id,goto:'unit'})).sort((a,b)=>b.rev-a.rev),
    total: ra.reduce((a,x)=>a+revOf(x.place,x.app),0)});
  // 3) IVT / high deduction → check traffic
  const ded=((DATA.deductions&&DATA.deductions.rows)||[]).filter(x=>x.flag==='ivt'&&(!APP||x.app===APP));
  if(ded.length) cards.push({action:'Invalid traffic (IVT) — traffic source check karo', conf:'high',
    why:'In placements ki deduction normal (2–5%) se zyada hai — invalid-traffic ka signal ho sakta hai.',
    rows: ded.map(x=>({place:x.place,sub:'deduction '+(x.pct?pct(x.pct):'—'),rev:x.revenue||0,id:idOf(x.place,x.app),goto:'placement'})).sort((a,b)=>b.rev-a.rev),
    total: ded.reduce((a,x)=>a+(x.revenue||0),0)});
  cards.sort((a,b)=>b.total-a.total);

  const totalOpp=cards.reduce((a,c)=>a+c.total,0);
  const totalPl=cards.reduce((a,c)=>a+c.rows.length,0);
  const cardHtml=cards.map((c,i)=>{
    const shown=c.rows.slice(0,6);
    const rows=shown.map(rw=>`<div onclick="${rw.goto==='unit'?`bGotoUnit('${rw.id}')`:`goPlacement('${rw.id}')`}" style="display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);cursor:pointer">
        <b style="color:#fff;font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${rw.place}</b>
        <span class="faint" style="font-size:11px;max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${rw.sub}</span>
        <span style="font-weight:700;font-size:12.5px;min-width:72px;text-align:right">${revCell(rw.rev)}</span></div>`).join('');
    const more=c.rows.length>6?`<div class="faint" style="font-size:11px;padding-top:7px">+${c.rows.length-6} aur placements — sabse zyada $ wale upar</div>`:'';
    return `<div class="card"><div style="display:flex;gap:12px;align-items:flex-start">
      <div style="font-size:18px;font-weight:800;color:var(--faint);min-width:22px">${i+1}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <b style="font-size:14.5px">${c.action}</b>
          <span class="pill ${c.conf==='high'?'p-r':'p-y'}">${c.conf}</span>
          <span class="pill p-b">${c.rows.length} placements</span>
          ${c.ab?'<span class="pill p-g" style="font-size:10px">A/B se confirm</span>':''}
          <span class="spacer"></span>
          <span style="font-weight:800;color:var(--cyan);font-size:15px">${revCell(c.total)}</span><span class="faint" style="font-size:11px">/wk at stake</span>
        </div>
        <div class="muted" style="font-size:12.5px;margin:5px 0 2px">${c.why}</div>
        ${rows}${more}
      </div></div></div>`;
  }).join('')||'<div class="al good"><span>✓</span><span>Abhi koi urgent recommendation nahi — placements theek chal rahe hain.</span></div>';

  s.innerHTML=`<h2 class="sc">Recommendations${APP?' · '+APP:''}</h2>
    <p class="scd">Aapke real signals se banaya — <b>action ke hisaab se grouped</b>, sabse zyada <b>$ impact</b> wala sabse upar. Har card ke andar affected placements $ se ranked (row → report card). Har change A/B test se confirm karo.</p>
    <div class="row c3" style="margin-bottom:14px">
      ${kpi('Total opportunity',revCell(totalOpp),stakeLbl+' · $/wk at stake','muted')}
      ${kpi('Action groups',cards.length,'ranked by $','muted')}
      ${kpi('Placements',totalPl,'need attention','muted')}</div>
    <div class="feed" style="gap:12px">${cardHtml}</div>`;
  return s;
}

// ---------- ACCOUNT HEALTH ----------
function renderHealth(){
  const s=screenDiv('health');const h=DATA.account_health||{issues:[],per_app:[]};
  const ivtCnt=(h.issues||[]).filter(i=>i[1].includes('invalid')).length;
  const tiles=[['IVT risk',ivtCnt?'🟡 '+ivtCnt+' flag':'🟢 clean'],['Ad serving',h.status==='red'?'🔴 Limited':'🟢 OK'],['Consent / TCF','⚪ not connected'],['app-ads.txt','⚪ not connected']];
  const per=(h.per_app||[]).filter(a=>!APP||a.app===APP);
  const perRows=per.map(a=>`<tr><td class="nm">${a.app}</td><td><span class="pill ${a.ivt==='flag'?'p-r':'p-g'}">${a.ivt==='flag'?'IVT risk':'clean'}</span></td><td><span class="pill p-g">ok</span></td><td class="muted">—</td><td class="muted">—</td><td class="muted">—</td></tr>`).join('')||'<tr><td colspan="6" class="muted" style="padding:16px">—</td></tr>';
  const issues=(h.issues||[]).map(([sev,msg])=>`<div class="al ${sev==='critical'?'crit':sev}"><span>${sev==='critical'?'🔴':sev==='warning'?'🟠':'🟡'}</span><span>${msg}</span></div>`).join('')||'<div class="al good"><span>✓</span><span>Koi IVT/serving issue nahi — sab clean.</span></div>';
  s.innerHTML=`<h2 class="sc">Account Health &amp; Compliance</h2><p class="scd">IVT aapke real deduction + CTR signals se. Consent/TCF/app-ads.txt AdMob API me nahi aate — inke liye alag connection chahiye (isliye abhi "not connected").</p>
    <div class="row c4" style="margin-bottom:16px">${tiles.map(t=>`<div class="card"><div class="l muted" style="font-size:11px;text-transform:uppercase;font-weight:700">${t[0]}</div><div style="font-size:16px;font-weight:800;margin-top:4px">${t[1]}</div></div>`).join('')}</div>
    <div class="row c3"><div class="card span2 pad0"><div class="ct" style="padding:16px 17px 0"><h3>Per-app${APP?' · '+APP:''}</h3></div><table style="margin-top:10px"><thead><tr><th>App</th><th>IVT</th><th>Serving</th><th>app-ads.txt</th><th>Consent</th><th>TCF</th></tr></thead><tbody>${perRows}</tbody></table></div>
    <div class="card"><div class="ct"><h3>Action items</h3></div><div class="feed">${issues}</div></div></div>`;
  return s;
}

// ---------- SETTINGS ----------
function renderSettings(){
  const s=screenDiv('settings');const accts=DATA.accounts||[];
  const cards=accts.map(a=>`<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><div><div class="appname">🏢 ${ACCNAMES[a.account_id]||a.label}</div><div class="muted" style="font-size:12px">${a.account_id}</div></div><span class="pill p-g">✓ Connected</span></div><div class="kv"><span class="k">OAuth token</span><span class="v" style="color:var(--good)">${a.token}</span></div><div class="kv"><span class="k">Apps</span><span class="v">${a.apps.length}</span></div><div class="kv"><span class="k">Last sync</span><span class="v">${a.last_sync}</span></div>
    <div style="margin-top:12px"><div class="muted" style="font-size:11.5px;margin-bottom:5px">Account ka naam <span class="faint">— jin apps ke naam same hain unpe ye tag lagega</span></div>
      <input type="text" value="${(ACCNAMES[a.account_id]||'').replace(/"/g,'&quot;')}" placeholder="jaise: Helsy Main" oninput="accNameSet('${a.account_id}',this.value)"
             style="width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:9px 11px;color:var(--ink);font-size:13px;font-family:inherit"></div>
    <div class="muted" style="font-size:12px;margin-top:12px">🔄 Auto-sync — GitHub ka robot chalata hai</div></div>`).join('')
    +`<div class="card" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div style="flex:1;min-width:200px"><div class="appname">✏️ Account naam save karo</div><div class="muted" style="font-size:12px;margin-top:3px">Robot agle run me apply karega — phir alerts/tables me <b>pub-6124…</b> ki jagah tumhara naam dikhega.</div></div><span class="abtn pri" style="cursor:pointer" onclick="accNameSave()">💾 Save names</span></div>`;
  // per-account app picker (checkbox = keep; unticked = hide + fetch band). From apps_catalog.
  const byAcc=appCatByAccount(); const accLabel={}; accts.forEach(a=>accLabel[a.account_id]=a.label||a.account_id);
  const tok=ghToken();
  const tokBar=tok?`<span class="pill p-g" style="font-size:11px">token set ✓</span>`
    :`<input id="astok" type="password" placeholder="github_pat_… / ghp_…" style="flex:1;min-width:180px;max-width:320px;background:var(--panel);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:6px 11px;font:inherit;outline:none"><button onclick="ghSetToken(document.getElementById('astok').value.trim());bToast('Token saved (browser me)');rerenderSettings()" style="border:1px solid var(--cyan);background:rgba(61,208,240,.14);color:#fff;font:inherit;font-weight:650;font-size:12.5px;padding:6px 13px;border-radius:8px;cursor:pointer">Save token</button>`;
  const appRow=(acc,x,on)=>`<label style="display:flex;align-items:center;gap:11px;padding:8px 4px;border-top:1px solid var(--line);cursor:pointer">
        <input type="checkbox" ${on?'checked':''} onchange="appPickToggle('${acc}','${x.app_id}')" style="width:17px;height:17px;accent-color:var(--cyan);cursor:pointer">
        <span style="flex:1;color:${on?'#fff':'var(--ink2)'};font-size:13px">${x.app_name}</span>
        <span class="faint" style="font-size:11px">rev ${money(x.rev)}</span></label>`;
  const pick=Object.keys(byAcc).sort().map(acc=>{ const apps=byAcc[acc].slice().sort((a,b)=>b.rev-a.rev);
    const decided=((APPSEL.accounts||{})[acc]||{}).decided;
    const vis=apps.filter(x=>appSelVisible(acc,x.app_id)); const hid=apps.filter(x=>!appSelVisible(acc,x.app_id));
    const visBlock=`<div style="font-size:11.5px;font-weight:700;color:#4ade80;margin:9px 0 1px">✓ Visible — ${vis.length}</div>`
      + (vis.length?vis.map(x=>appRow(acc,x,true)).join(''):'<div class="faint" style="font-size:11.5px;padding:5px 4px">koi app select nahi — sab hidden hain</div>');
    const hidBlock=hid.length?`<div style="font-size:11.5px;font-weight:700;color:#ff9a9a;margin:14px 0 1px">🚫 Hidden — ${hid.length} <span class="faint" style="font-weight:400">(dashboard + fetch se bahar; tick karke wapas laao)</span></div>`
      + hid.map(x=>appRow(acc,x,false)).join(''):'';
    return `<div class="card" style="margin-bottom:14px">
      <div class="ct"><h3>🏢 ${accLabel[acc]||acc}</h3><span class="faint" style="font-size:11.5px">${vis.length}/${apps.length} visible${decided?'':' · abhi sab (undecided)'}</span></div>
      <div style="display:flex;gap:8px;margin:2px 0 2px"><button onclick="appPickAll('${acc}',true)" style="border:1px solid var(--line2);background:var(--panel);color:var(--ink2);font:inherit;font-size:11.5px;padding:4px 10px;border-radius:7px;cursor:pointer">Sab select</button><button onclick="appPickAll('${acc}',false)" style="border:1px solid var(--line2);background:var(--panel);color:var(--ink2);font:inherit;font-size:11.5px;padding:4px 10px;border-radius:7px;cursor:pointer">Sab clear</button></div>
      ${visBlock}${hidBlock}</div>`;}).join('');
  s.innerHTML=`<h2 class="sc">Accounts &amp; Apps</h2><p class="scd">Neeche har account ki apps me se jo chahiye wahi <b>tick</b> karo — untick wali dashboard se hat jaayengi aur aage fetch bhi band (purana data delete nahi hoga). Save karne ke baad robot agle run me poora apply karega.</p>
    <div class="row c2" style="margin-bottom:14px">${cards}</div>
    <div class="card" style="margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 13px">
      <span style="font-size:12.5px;color:var(--ink2)">🔑 Selection save karne ke liye GitHub token:</span>${tokBar}
      <button onclick="appPickSave()" style="border:1px solid #4ade80;background:rgba(74,222,128,.14);color:#fff;font:inherit;font-weight:650;font-size:12.5px;padding:6px 14px;border-radius:8px;cursor:pointer;margin-left:auto">💾 Selection save</button></div>
    ${pick||'<div class="card"><div class="muted" style="font-size:13px">Apps abhi load nahi hui — robot run ke baad yahan aayengi.</div></div>'}
    <div class="card" style="margin-top:6px;border-style:dashed;border-color:var(--line2)"><div class="muted" style="font-size:13px">➕ <b style="color:var(--ink)">Naya AdMob account add karna hai?</b> Mujhe bolo — step-by-step guide kar dunga (OAuth token → GitHub secret). Naya account add hote hi uski apps yahan selection ke liye aa jaayengi.</div></div>`;
  return s;
}

async function load(){
  try{
    if(!DATA){
      // Static host: read dashboard.json sitting next to this page.
      // Live API host: set window.__DATA_URL__ or fall back to /dashboard.
      const url = (window.__DATA_URL__ || "dashboard.json")+"?t="+Date.now();  // cache-bust the FIRST load too, so a hard refresh always pulls the newest data
      let r = await fetch(url, {cache:"no-store"});
      if(!r.ok){ r = await fetch(API_BASE+"/dashboard", {cache:"no-store"}); }
      DATA = await r.json();
    }
    render();
    loadAppSel();                            // which apps the user kept (hides unselected)
    loadAccNames();                          // friendly names for the AdMob accounts
    loadAppNames();                          // the user's own names for apps (✏️ on App Report)
    setInterval(updateFreshness, 30000);    // tick "X min pehle" every 30s
    setInterval(refreshData, 300000);        // pull fresh data every 5 min (robot updates hourly)
  }
  catch(e){ document.getElementById('content').innerHTML='<div class="note">Data load nahi ho paya (dashboard.json / '+API_BASE+'/dashboard). Robot chalne ke baad yahan aapka data aa jayega.</div>'; }
}
load();
</script>
