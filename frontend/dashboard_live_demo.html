<script>
const API_BASE = window.__API_BASE__ || "";
let DATA = window.__DASHBOARD__ || null;
let RANGE = "7d";
const money=(n)=>"$"+Number(n).toLocaleString(undefined,{maximumFractionDigits:0});
const pct=(n)=>(n*100).toFixed(0)+"%";
const signed=(n)=>(n>=0?"+":"")+(n*100).toFixed(0)+"%";
const hb=(h)=>h>=75?"good":h>=50?"watch":"risk";
const ICON={good:"🎉",critical:"🔴",warning:"🟠",watch:"🟡"};
const TITLES={overview:["Portfolio Overview","Live · engine-computed"],placements:["Placements","Grouped by app · drill in"],
  reportcard:["Placement Report Card","Historical + funnel"],movers:["Movers · Increasing vs Decreasing","Kaun upar, kaun neeche"],
  alerts:["Alerts · Anomaly & Drop Detection","0/drop + improvements · country"],deductions:["Revenue Deduction","Estimate decay + IVT"],
  countries:["Country Strategy","Per-geo · per-app"],mediation:["Mediation","Network competition"],
  reco:["Recommendations","Ranked · with uplift"],health:["Account Health & Compliance","IVT · consent · app-ads.txt"],
  settings:["Accounts & Apps","Connect · auto-sync"]};

// ---- small chart helpers (compute from data) ----
function areaChart(values,w=620,h=140,color="#3dd0f0",grad="gA"){
  if(!values.length) return "";
  const pad=8,top=12,mn=Math.min(...values),mx=Math.max(...values),rng=(mx-mn)||1;
  const xs=values.map((_,i)=>pad+(w-2*pad)*i/(values.length-1));
  const ys=values.map(v=>top+(h-top-pad)*(1-(v-mn)/rng));
  const line="M"+xs.map((x,i)=>`${x.toFixed(1)} ${ys[i].toFixed(1)}`).join(" L");
  const area=`M${xs[0].toFixed(1)} ${h-pad} L`+xs.map((x,i)=>`${x.toFixed(1)} ${ys[i].toFixed(1)}`).join(" L")+` L${xs[xs.length-1].toFixed(1)} ${h-pad} Z`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:150px">
    <defs><linearGradient id="${grad}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".33"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${grad})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.3"/></svg>`;
}
function microbar(trend){
  const v=trend.slice(-6); if(!v.length) return "";
  const mn=Math.min(...v),mx=Math.max(...v),rng=(mx-mn)||1;
  const up=v[v.length-1]>=v[0]; const cls=up?"g":"r";
  return `<span class="microbar ${cls}">`+v.map(x=>`<i style="height:${(5+11*(x-mn)/rng).toFixed(0)}px"></i>`).join("")+`</span>`;
}
function sparkbars(trend,cls){
  const v=trend.slice(-7); if(!v.length) return "";
  const mn=Math.min(...v),mx=Math.max(...v),rng=(mx-mn)||1;
  return `<div class="spark ${cls||''}">`+v.map(x=>`<i style="height:${(25+75*(x-mn)/rng).toFixed(0)}%"></i>`).join("")+`</div>`;
}
function fmtVal(m,v){if(m==='match_rate'||m==='show_rate')return (v*100).toFixed(0)+'%';if(m==='ctr')return (v*100).toFixed(1)+'%';if(m==='ecpm'||m==='revenue')return '$'+v;return Number(v).toLocaleString();}
function filterAlerts(f){document.querySelectorAll('.screen[data-screen=alerts] .alert').forEach(c=>{c.style.display=(f==='all'||c.dataset.sev===f||c.dataset.metric===f)?'':'none';});}
function filterPlDetail(f){document.querySelectorAll('#pl-detail tbody tr').forEach(r=>{if(r.classList.contains('grp')){r.style.display='';return;}let s=true;if(f==='improving')s=r.dataset.dir==='up';else if(f==='declining')s=r.dataset.dir==='down';else if(f!=='all')s=r.dataset.fmt===f;r.style.display=s?'':'none';});}

function screenDiv(id){const d=document.createElement('section');d.className='screen';d.dataset.screen=id;return d;}
function kpi(l,v,d,cls,spark){return `<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d ${cls||'muted'}">${d||''}</div>${spark||''}</div>`;}

function render(){
  const root=document.getElementById('screens');root.innerHTML='';
  root.append(renderOverview(),renderPlacements(),renderReport(),renderMovers(),renderAlerts(),
              renderDeductions(),renderCountries(),renderMediation(),renderReco(),renderHealth(),renderSettings());
  const c=DATA.alerts.counts;document.getElementById('nav-alert').textContent=(c.critical||0)+(c.warning||0);
  document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.screen)));
  document.querySelectorAll('#timeseg button').forEach(b=>b.addEventListener('click',()=>setRange(b.dataset.range)));
  document.addEventListener('click',e=>{const c=e.target.closest('.chip');if(c&&c.parentElement){c.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');}});
  show('overview');
}
function setRange(r){
  RANGE=r;document.querySelectorAll('#timeseg button').forEach(b=>b.classList.toggle('on',b.dataset.range===r));
  const ov=document.querySelector('.screen[data-screen=overview]');const cur=ov.classList.contains('on');
  ov.replaceWith(renderOverview());if(cur)document.querySelector('.screen[data-screen=overview]').classList.add('on');
}
function show(id){
  if(id==='placements'){const a=document.getElementById('pl-apps'),d=document.getElementById('pl-detail');if(a&&d){a.style.display='';d.style.display='none';}}
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.dataset.screen===id));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.screen===id));
  if(TITLES[id]){document.getElementById('tb-title').textContent=TITLES[id][0];document.getElementById('tb-sub').textContent=TITLES[id][1];}
  window.scrollTo({top:0});
}

// ---------- OVERVIEW ----------
function renderOverview(){
  const s=screenDiv('overview');const k=DATA.kpis_by_range?DATA.kpis_by_range[RANGE]:DATA.kpis;const m=DATA.movers;const a=DATA.alerts;
  const dl={today:['▲ vs yest','up'],yesterday:['▬ DoD','flat'],'7d':['▲ 6.4% WoW','up'],'30d':['▲ 11% MoM','up']}[RANGE];
  const alertItems=a.items.slice(0,4).map(x=>{const sev=x.severity==='critical'?'crit':x.severity;
    return `<div class="al ${sev}"><span>${ICON[x.severity]}</span><span><b>${x.place}</b> — ${x.message}<span class="geochip ${x.country.includes('localized')?'loc':''}">${x.country}</span></span></div>`;}).join('');
  const appRows=DATA.apps.map(ap=>`<tr class="clk" onclick="openApp('${ap.name}')"><td class="nm">${ap.name}</td><td>${ap.account}</td><td>${money(ap.revenue)}</td><td>${ap.placements}</td><td><span class="hs ${hb(ap.avg_health)}">${ap.avg_health}</span></td></tr>`).join('');
  s.innerHTML=`<div class="row c5" style="margin-bottom:14px">
      ${kpi('Revenue · '+RANGE,money(k.revenue),dl[0],dl[1],sparkbars(DATA.revenue_trend,'g'))}
      ${kpi('ARPDAU','$'+k.arpdau,'▲ 3.1%','up',sparkbars(DATA.revenue_trend))}
      ${kpi('Avg eCPM','$'+k.ecpm,'▬ flat','flat',sparkbars(DATA.revenue_trend))}
      ${kpi('Match rate',pct(k.match_rate),'▼ 4pt','down',sparkbars(DATA.revenue_trend,'r'))}
      ${kpi('Accounts · Apps',DATA.kpis.accounts+' · '+DATA.kpis.apps,'🟢 fetching','muted')}
    </div>
    <div class="row c3" style="margin-bottom:14px">
      <div class="card span2"><div class="ct"><h3>Revenue trend · 14 days</h3><span class="tag">All accounts</span></div>${areaChart(DATA.revenue_trend)}<div class="lgd"><span><i class="dot" style="background:#3dd0f0"></i> Daily revenue</span></div></div>
      <div class="card"><div class="ct"><h3>Top movers</h3></div><div class="feed">
        ${m.increasing.slice(0,2).map(p=>`<div class="al good"><span>▲</span><span><b>${p.name}</b> ${signed(p.change_pct)} · ${p.app}</span></div>`).join('')}
        ${m.decreasing.slice(0,2).map(p=>`<div class="al crit"><span>▼</span><span><b>${p.name}</b> ${signed(p.change_pct)} · ${p.app}</span></div>`).join('')}
      </div></div>
    </div>
    <div class="row c3">
      <div class="card span2 pad0"><div class="ct" style="padding:16px 17px 0"><h3>Revenue by account &amp; app</h3><span class="lnk" onclick="show('placements')">View placements →</span></div>
        <table style="margin-top:10px"><thead><tr><th>App</th><th>Account</th><th>Revenue</th><th>Placements</th><th>Avg health</th></tr></thead><tbody>${appRows}</tbody></table></div>
      <div class="card"><div class="ct"><h3>Needs attention</h3><span class="pill p-r">${(a.counts.critical||0)+(a.counts.warning||0)} alerts</span></div><div class="feed">${alertItems}</div></div>
    </div>`;
  return s;
}

// ---------- PLACEMENTS (2-level) ----------
function fmtCount(ps){const b={};ps.forEach(p=>b[p.format]=(b[p.format]||0)+1);return b;}
function renderPlacements(){
  const s=screenDiv('placements');
  const byApp={};DATA.placements.forEach(p=>{(byApp[p.app]=byApp[p.app]||[]).push(p)});
  const cards=DATA.apps.map(ap=>{const g=ap.avg_health,dist=g>=75?[70,22,8]:g>=50?[55,30,15]:[40,30,30];
    return `<div class="card appcard" onclick="openApp('${ap.name}')"><div style="display:flex;justify-content:space-between"><div><div class="appname">📱 ${ap.name}</div><div class="muted" style="font-size:12px">${ap.account}</div></div><span class="pill ${ap.declining?'p-y':'p-g'}">${ap.declining} declining</span></div>
      <div class="appstat" style="margin-top:10px"><div><div class="n">${money(ap.revenue)}</div><div class="t">Revenue</div></div><div><div class="n">${ap.placements}</div><div class="t">Placements</div></div><div><div class="n" style="color:${g>=75?'var(--good)':g>=50?'var(--watch)':'var(--bad)'}">${ap.avg_health}</div><div class="t">Avg health</div></div></div>
      <div class="hbar"><i style="width:${dist[0]}%;background:var(--good)"></i><i style="width:${dist[1]}%;background:var(--watch)"></i><i style="width:${dist[2]}%;background:var(--bad)"></i></div>
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="muted" style="font-size:12px">🟡 ${ap.declining} declining · 🔴 ${ap.at_risk} at-risk</span><span class="lnk">View ${ap.placements} placements →</span></div></div>`;}).join('');
  s.innerHTML=`<h2 class="sc">Placements</h2><p class="scd">App-wise — app card pe click karke uske placements format-wise dekho.</p>
    <div id="pl-apps" class="row c3">${cards}</div>
    <div id="pl-detail" style="display:none"></div>`;
  return s;
}
function openApp(name){
  show('placements');
  const ps=DATA.placements.filter(p=>p.app===name);const app=DATA.apps.find(a=>a.name===name)||{account:'',revenue:0,avg_health:0,at_risk:0};
  const byFmt={};ps.forEach(p=>{(byFmt[p.format]=byFmt[p.format]||[]).push(p)});
  let rows='';Object.entries(byFmt).forEach(([fmt,arr])=>{
    const rev=arr.reduce((a,b)=>a+b.revenue,0);
    rows+=`<tr class="grp"><td colspan="7">${fmt} <span class="cnt">· ${arr.length} placements · ${money(rev)}</span></td></tr>`;
    arr.forEach(p=>{const cls=p.change_pct>0.02?'up':p.change_pct<-0.02?'down':'flat';
      rows+=`<tr class="clk" data-fmt="${p.format}" data-dir="${cls}" onclick="goPlacement('${p.id}')"><td><span class="hs ${p.band}">${p.health}</span></td><td class="nm">${p.name}</td><td>$${p.ecpm}</td><td>${pct(p.match)}</td><td>${microbar(p.trend)} <span class="${cls}">${signed(p.change_pct)}</span></td><td>${pct(p.deduction_pct)}</td><td><span class="pill ${p.verdict==='strong'?'p-g':p.verdict==='declining'?'p-r':'p-y'}">${p.verdict}</span></td></tr>`;});
  });
  const chips=`<span class="chip on" onclick="filterPlDetail('all')">All formats</span>`+Object.entries(byFmt).map(([f,a])=>`<span class="chip" onclick="filterPlDetail('${f}')">${f} ${a.length}</span>`).join('')+`<span class="chip" style="margin-left:8px" onclick="filterPlDetail('improving')">📈 Improving</span><span class="chip" onclick="filterPlDetail('declining')">🔻 Declining</span>`;

  const d=document.getElementById('pl-detail');d.style.display='block';
  d.innerHTML=`<div class="backlnk" onclick="show('placements')">← Back to apps</div>
    <div class="verdict" style="background:linear-gradient(90deg,#12213a,transparent);border:1px solid var(--line2)"><div style="font-size:26px">📱</div><div><div class="big">${name}</div><div class="muted" style="font-size:12.5px">${app.account} · ${ps.length} placements · ${money(app.revenue)}</div></div><div class="spacer"></div><div class="appstat"><div><div class="n" style="color:var(--good)">${app.avg_health}</div><div class="t">Avg health</div></div><div><div class="n" style="color:var(--bad)">${app.at_risk}</div><div class="t">At-risk</div></div></div></div>
    <div class="chips" style="margin-top:14px">${chips}</div>
    <div class="card pad0"><table><thead><tr><th>Health</th><th>Placement</th><th>eCPM</th><th>Match</th><th>Trend</th><th>Deduction</th><th>Verdict</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="faint" style="font-size:12px;margin-top:10px">Showing ${ps.length} placements · grouped by format · row → Report Card</p>`;
  document.querySelector('.screen[data-screen=placements]').classList.add('on');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.screen==='placements'));
  window.scrollTo({top:0});
}

// ---------- REPORT CARD (empty shell; filled by goPlacement) ----------
function renderReport(){return screenDiv('reportcard');}
function goPlacement(id){
  const p=DATA.placements.find(x=>x.id===id)||DATA.placements[0];
  const vcls=p.verdict==='strong'?'g':p.verdict==='declining'?'r':'y';
  const vbg=p.verdict==='declining'?'var(--bad-b)':p.verdict==='strong'?'var(--good-b)':'var(--watch-b)';
  const s=document.querySelector('.screen[data-screen=reportcard]');
  const chg=(w)=>signed(p.change_pct*(w/9));
  s.innerHTML=`<div class="backlnk" onclick="show('placements')">← Back to placements</div>

// ---------- MOVERS ----------
function renderMovers(){
  const s=screenDiv('movers');const m=DATA.movers;

  const big=m.increasing[0];
  s.innerHTML=`<h2 class="sc">Movers — kaun upar, kaun neeche</h2><p class="scd">Trend ke hisaab se ranked. Row → report card.</p>
    <div class="chips"><span class="chip on">All apps</span>${[...new Set(DATA.placements.map(p=>p.app))].map(a=>`<span class="chip">${a}</span>`).join('')}</div>

    <div class="row c2"><div class="card"><div class="ct"><h3 style="color:var(--good)">📈 Increasing (${m.increasing.length})</h3></div><div class="feed">${li(m.increasing,'up')}</div></div>
    <div class="card"><div class="ct"><h3 style="color:var(--bad)">📉 Decreasing (${m.decreasing.length})</h3></div><div class="feed">${li(m.decreasing,'down')}</div></div></div>`;

// ---------- ALERTS ----------
function renderAlerts(){
  const s=screenDiv('alerts');const a=DATA.alerts;
  const cards=a.items.map(x=>{const sev=x.severity==='critical'?'crit':x.severity;
    const cause=x.kind==='zero'?'Ad unit disabled / SDK request nahi — integration check.':x.kind==='spike'?'🚨 Invalid-traffic risk — traffic source check.':x.kind==='improve'?'✅ Achha chal raha — push karo.':'Sharp drop — floor/demand dekho.';
    return `<div class="alert ${sev}" data-sev="${x.severity}" data-metric="${x.metric}"><div style="font-size:17px">${ICON[x.severity]}</div><div class="abody"><div class="atitle">${x.message}<span class="geochip ${x.country.includes('localized')?'loc':''}">${x.country}</span></div><div class="ameta">${x.place} · ${x.app} · ${x.metric}</div><div class="acause">💡 ${cause}</div><div class="aact"><span class="abtn pri">View placement</span><span class="abtn">Acknowledge</span><span class="abtn">Snooze 4h</span></div></div><div class="aval"><div class="big ${x.severity==='good'?'up':'down'}">${fmtVal(x.metric,x.current)}</div><div class="sm">now</div></div></div>`;}).join('');
  const rules=[['Koi metric = 0','Critical','p-r'],['Revenue drop > 40%','Warn','p-y'],['Requests drop > 50%','Warn','p-y'],['Match rate drop > 20pt','Warn','p-y'],['CTR spike > 3× (IVT)','Critical','p-r'],['Show rate drop > 15pt','Watch','p-b']];
  s.innerHTML=`<h2 class="sc">Alerts</h2><p class="scd">0/sharp-drop → alert; behtar ho to 🎉 improvement — country ke saath.</p>
    <div class="row c4" style="margin-bottom:14px">${kpi('🎉 Improving',a.counts.improving||0,'placements/geos','up')}${kpi('🔴 Critical',a.counts.critical||0,'0-value','down')}${kpi('🟠 Warning',a.counts.warning||0,'sharp drop','flat')}${kpi('✓ Resolved · today','5','auto','up')}</div>
    <div class="chips"><span class="chip on" onclick="filterAlerts('all')">All active</span><span class="chip" onclick="filterAlerts('good')">🎉 Improvements</span><span class="chip" onclick="filterAlerts('critical')">🔴 Critical</span><span class="chip" onclick="filterAlerts('warning')">🟠 Warning</span><span class="chip" style="margin-left:8px" onclick="filterAlerts('requests')">Requests</span><span class="chip" onclick="filterAlerts('match_rate')">Match rate</span><span class="chip" onclick="filterAlerts('ctr')">CTR</span><span class="chip" onclick="filterAlerts('revenue')">Revenue</span></div>
    <div class="row c3"><div class="span2" style="display:grid;gap:10px;align-content:start">${cards}</div>
    <div style="display:grid;gap:14px;align-content:start">
      <div class="card"><div class="ct"><h3>Alert rules</h3><span class="lnk">Edit</span></div>${rules.map((r,i)=>`<div class="rule"><span class="tgl ${i===5?'off':''}"></span><div style="flex:1">${r[0]}</div><span class="pill ${r[2]}">${r[1]}</span></div>`).join('')}<div style="font-size:11px;color:var(--muted);margin-top:9px">Baseline = 7-day median. Har data pull pe check.</div></div>
      <div class="card"><div class="ct"><h3>Notifications</h3></div><div class="rule"><span style="font-size:15px">✈️</span><div style="flex:1">Telegram <span class="muted" style="font-size:11px">· free</span></div><span class="tgl"></span></div><div class="rule"><span style="font-size:15px">✉️</span><div style="flex:1">Email <span class="muted" style="font-size:11px">· free</span></div><span class="tgl"></span></div><div style="font-size:11px;color:var(--muted);margin-top:9px">Critical turant, warnings hourly batch.</div></div>
    </div></div>`;
  return s;
}

// ---------- DEDUCTIONS ----------
function renderDeductions(){
  const s=screenDiv('deductions');const d=DATA.deductions;
  const ser=d.decay_example.series;
  const pad=10,top=10,w=360,h=120,mn=Math.min(...ser),mx=Math.max(...ser),rng=(mx-mn)||1;
  const xs=ser.map((_,i)=>pad+(w-2*pad)*i/(ser.length-1));const ys=ser.map(v=>top+(h-top-pad)*(1-(v-mn)/rng));
  const line="M"+xs.map((x,i)=>`${x.toFixed(1)} ${ys[i].toFixed(1)}`).join(" L");
  const dots=xs.map((x,i)=>`<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="3.4" fill="#ff6b6b"/>`).join('');
  const rows=d.rows.map(r=>`<tr><td class="nm">${r.place}</td><td>${r.app} · ${r.geo}</td><td><div class="meter ${r.flag==='ivt'?'r':r.flag==='watch'?'y':'g'}"><i style="width:${Math.min(100,r.pct*400)}%"></i></div></td><td class="${r.flag==='ivt'?'down':''}" style="font-weight:700">${pct(r.pct)}</td><td><span class="pill ${r.flag==='ivt'?'p-r':r.flag==='watch'?'p-y':'p-g'}">${r.flag==='ivt'?'IVT risk':r.flag}</span></td></tr>`).join('');
  s.innerHTML=`<h2 class="sc">Revenue Deduction Tracking</h2><p class="scd">AdMob estimate → finalized decay. Localized bada deduction = IVT early warning.</p>
    <div class="row c3" style="margin-bottom:14px">${kpi('Avg deduction',pct(d.avg_pct),'normal 2–5%','muted')}${kpi('Above normal',d.rows.filter(r=>r.flag!=='normal').length,'needs review','down')}${kpi('Est. revenue at risk','$285/mo','if continues','muted')}</div>
    <div class="row c3" style="margin-bottom:14px">
      <div class="card span2"><div class="ct"><h3>Estimate decay · ${d.decay_example.place}</h3><span class="pill p-r">−20% deducted</span></div>
        <svg class="chart" viewBox="0 0 ${w} ${h}" style="height:150px;width:auto;max-width:100%"><path d="${line}" fill="none" stroke="#ff6b6b" stroke-width="2.5"/>${dots}</svg>
        <div class="lgd"><span>D+1 = $${ser[0]}</span><span>finalized = <b style="color:var(--bad)">$${ser[ser.length-1]}</b></span></div></div>
      <div class="card" style="border-color:#5a2626;background:linear-gradient(160deg,#231320,#111d31)"><div class="ct"><h3>🚨 IVT early warning</h3></div><p style="font-size:13px;color:var(--ink2);margin:2px 0 10px">Bottom_Banner (ID) deduction <b style="color:var(--bad)">20%</b> — normal se zyada, ek geo pe localized. Invalid-traffic signal.</p><div class="kv"><span class="k">Normal</span><span class="v">2–5%</span></div><div class="kv"><span class="k">This placement</span><span class="v" style="color:var(--bad)">20%</span></div></div>
    </div>
    <div class="card pad0"><table><thead><tr><th>Placement</th><th>App · Geo</th><th>Deduction</th><th>%</th><th>Flag</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  return s;
}

// ---------- COUNTRIES ----------
function renderCountries(){
  const s=screenDiv('countries');const cs=DATA.countries;
  const top=cs[0]||{};const fill=cs.find(c=>c.match<0.7);const totalUp=cs.reduce((a,b)=>a+b.uplift,0);
  const rows=cs.map(c=>`<tr><td class="nm">${c.country}</td><td><span class="pill ${c.tier===1?'p-b':c.tier===2?'p-y':'p-y'}">${c.tier}</span></td><td>$${c.ecpm}</td><td class="${c.match<0.7?'down':''}">${pct(c.match)}</td><td>${money(c.revenue)}</td><td class="muted">${c.why}</td><td><span class="pill ${c.uplift>0?'p-g':'p-b'}">${c.suggested}</span></td><td class="est">${c.uplift?money(c.uplift)+'/mo':'—'}</td></tr>`).join('');
  s.innerHTML=`<h2 class="sc">Country Strategy</h2><p class="scd">Per-geo revenue/eCPM + format suggestion (justifying metric ke saath).</p>
    <div class="chips"><span class="chip on">All apps</span>${DATA.apps.map(a=>`<span class="chip">${a.name}</span>`).join('')}<span class="chip" style="margin-left:8px">Highest uplift first</span></div>
    <div class="row c4" style="margin-bottom:14px">${kpi('Top revenue geo',top.country||'—',money(top.revenue||0),'muted')}${kpi('Best opportunity',top.country||'—',top.uplift?money(top.uplift)+'/mo':'','up')}${kpi('Fill problem geo',fill?fill.country:'—',fill?pct(fill.match):'ok',fill?'down':'muted')}${kpi('Total geo uplift',money(totalUp)+'/mo','across changes','up')}</div>
    <div class="card pad0"><table><thead><tr><th>Country</th><th>Tier</th><th>eCPM</th><th>Match</th><th>Revenue</th><th>Why</th><th>Suggested</th><th>Uplift</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  return s;
}

// ---------- MEDIATION ----------
function renderMediation(){
  const s=screenDiv('mediation');const m=DATA.mediation;
  const rows=m.rows.map(r=>`<tr><td class="nm">${r.ad_source}</td><td><span class="pill ${r.type==='waterfall'?'p-y':'p-g'}">${r.type}</span></td><td>${pct(r.fill)}</td><td>$${r.ecpm.toFixed(2)}</td><td>${pct(r.rev_share)}</td><td>${r.latency_s}s</td><td><span class="pill ${r.status==='stale'?'p-r':r.status==='latency'?'p-y':'p-g'}">${r.status==='stale'?'Stale':r.status==='latency'?'Latency':'OK'}</span></td></tr>`).join('');
  const bs=m.summary.bidding_share;
  const sug=m.suggestions.map(x=>`<div class="al good"><span>💡</span><span><b>${x.action}</b> — ${x.reason}</span></div>`).join('');
  s.innerHTML=`<h2 class="sc">Mediation — networks ki competition</h2><p class="scd">Per-network fill/eCPM/share + advisor.</p>
    <div class="chips"><span class="chip on">All apps</span>${DATA.apps.map(a=>`<span class="chip">${a.name}</span>`).join('')}<span class="chip" style="margin-left:8px">Bidding only</span></div>
    <div class="row c4" style="margin-bottom:14px">${kpi('Networks',m.summary.networks,'','muted')}${kpi('Bidding share',pct(bs),'▲ recommended','up')}${kpi('Best eCPM',m.summary.best_ecpm.ad_source,'$'+m.summary.best_ecpm.ecpm.toFixed(2),'muted')}${kpi('Blended fill',pct(m.summary.blended_fill),'','muted')}</div>
    <div class="card pad0" style="margin-bottom:14px"><div class="ct" style="padding:16px 17px 0"><h3>Network performance</h3><span class="lnk">＋ Add network</span></div><table style="margin-top:10px"><thead><tr><th>Network</th><th>Type</th><th>Fill</th><th>eCPM</th><th>Rev share</th><th>Latency</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="row c2"><div class="card"><div class="ct"><h3>Bidding vs Waterfall</h3></div><div style="display:flex;height:10px;border-radius:100px;overflow:hidden;background:var(--raise);margin:6px 0 10px"><i style="width:${(bs*100).toFixed(0)}%;background:var(--good)"></i><i style="width:${(100-bs*100).toFixed(0)}%;background:var(--watch)"></i></div><div class="lgd"><span><i class="dot" style="background:var(--good)"></i> Bidding ${pct(bs)}</span><span><i class="dot" style="background:var(--watch)"></i> Waterfall ${pct(1-bs)}</span></div><p style="font-size:13px;color:var(--ink2);margin-top:10px">Google recommendation: <b>hybrid</b>. Bidding share badhao.</p></div>
    <div class="card" style="border-color:#2b466f"><div class="ct"><h3>💡 Suggestions</h3><span class="pill p-p">est. +$260/mo</span></div><div class="feed">${sug}</div></div></div>`;
  return s;
}

// ---------- RECOMMENDATIONS ----------
function renderReco(){
  const s=screenDiv('reco');const r=DATA.recommendations;
  const items=r.items.map((x,i)=>`<div class="card" style="display:flex;gap:15px;align-items:flex-start"><div style="font-size:20px;font-weight:800;color:var(--faint);min-width:24px">${i+1}</div><div style="flex:1"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${x.action}</b><span class="pill p-p">${x.confidence}</span>${x.ab?'<span class="pill p-b">A/B</span>':''}</div><div class="muted" style="font-size:13px;margin-top:4px">${x.reason} · ${x.place}</div></div><div style="text-align:right;min-width:100px">${x.uplift?'<div class="est" style="font-size:18px">'+money(x.uplift)+'/mo</div>':''}</div></div>`).join('');
  s.innerHTML=`<h2 class="sc">Recommendations</h2><p class="scd">Ranked · root cause: <b style="color:var(--watch)">${r.root_cause[0]}</b> — ${r.root_cause[1]}</p>
    <div class="card" style="margin-bottom:14px;display:flex;align-items:center;gap:18px;flex-wrap:wrap"><div><div class="muted" style="font-size:12px">Total estimated uplift</div><div style="font-size:28px;font-weight:800;color:var(--good)">${money(r.total_uplift)}/mo</div></div><div style="height:36px;width:1px;background:var(--line2)"></div><div><div class="muted" style="font-size:12px">≈ Current monthly</div><div style="font-size:18px;font-weight:700">~+18%</div></div><div class="spacer"></div><div class="muted" style="font-size:12px;max-width:260px">Har change A/B se confirm karo. Decision metric: total revenue + retention.</div></div>

// ---------- ACCOUNT HEALTH ----------
function renderHealth(){
  const s=screenDiv('health');const h=DATA.account_health;
  const tiles=[['Ad serving',h.status==='red'?'🔴 Limited':'🟢 No limits'],['IVT risk',h.issues.some(i=>i[1].includes('invalid'))?'🟡 flag':'🟢 clean'],['Consent (TCF)',h.issues.some(i=>i[1].includes('consent'))?'🟡 gaps':'🟢 ok'],['app-ads.txt','🟢 verified']];
  const per=h.per_app||[];
  const perRows=per.map(a=>`<tr><td class="nm">${a.app}</td><td><span class="pill p-g">✓ verified</span></td><td><span class="pill p-g">${a.consent}</span></td><td><span class="pill ${a.tcf==='v2.3'?'p-g':'p-y'}">${a.tcf}</span></td><td><span class="pill ${a.ivt==='flag'?'p-r':'p-g'}">${a.ivt}</span></td><td><span class="pill p-g">${a.serving}</span></td></tr>`).join('');
  const issues=h.issues.map(([sev,msg])=>`<div class="al ${sev==='critical'?'crit':sev}"><span>${sev==='critical'?'🔴':sev==='warning'?'🟠':'🟡'}</span><span>${msg}</span></div>`).join('')||'<div class="al good"><span>✓</span><span>All clear</span></div>';
  s.innerHTML=`<h2 class="sc">Account Health &amp; Compliance</h2><p class="scd">IVT · consent · app-ads.txt — problem se pehle.</p>
    <div class="row c4" style="margin-bottom:16px">${tiles.map(t=>`<div class="card"><div class="l muted" style="font-size:11px;text-transform:uppercase;font-weight:700">${t[0]}</div><div style="font-size:16px;font-weight:800;margin-top:4px">${t[1]}</div></div>`).join('')}</div>
    <div class="row c3"><div class="card span2 pad0"><div class="ct" style="padding:16px 17px 0"><h3>Per-app compliance</h3></div><table style="margin-top:10px"><thead><tr><th>App</th><th>app-ads.txt</th><th>Consent</th><th>TCF</th><th>IVT</th><th>Serving</th></tr></thead><tbody>${perRows}</tbody></table></div>
    <div class="card"><div class="ct"><h3>Action items</h3></div><div class="feed">${issues}</div></div></div>`;
  return s;
}

// ---------- SETTINGS ----------
function renderSettings(){
  const s=screenDiv('settings');const accts=DATA.accounts||[];
  const cards=accts.map(a=>`<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><div><div class="appname">🏢 ${a.label}</div><div class="muted" style="font-size:12px">${a.account_id}</div></div><span class="pill p-g">✓ Connected</span></div><div class="kv"><span class="k">OAuth token</span><span class="v" style="color:var(--good)">${a.token}</span></div><div class="kv"><span class="k">Apps</span><span class="v">${a.apps.length} · ${a.apps.join(', ')}</span></div><div class="kv"><span class="k">Last sync</span><span class="v">${a.last_sync}</span></div><div style="display:flex;gap:8px;margin-top:12px"><span class="abtn pri">Re-sync</span><span class="abtn">Re-authorize</span><span class="abtn">Remove</span></div></div>`).join('');
  const appRows=DATA.apps.map(a=>`<tr><td class="nm">${a.name}</td><td>${a.account}</td><td>Android</td><td>${a.placements}</td><td><span class="pill p-g">Active</span></td></tr>`).join('');
  s.innerHTML=`<h2 class="sc">Accounts &amp; Apps</h2><p class="scd">AdMob accounts connect karo (ek baar OAuth). Apps auto-sync hote hain.</p>
    <div class="row c2" style="margin-bottom:14px">${cards}</div>
    <div class="addbtn" style="margin-bottom:18px">＋ Connect new AdMob account <span style="font-weight:500;color:var(--muted);font-size:12px">— ek baar Google OAuth, phir apps auto-sync</span></div>
    <div class="card pad0"><div class="ct" style="padding:16px 17px 0"><h3>Apps <span class="muted" style="font-weight:500;font-size:12px">· auto-synced</span></h3><span class="lnk">🔄 Re-sync all</span></div><table style="margin-top:10px"><thead><tr><th>App</th><th>Account</th><th>Platform</th><th>Placements</th><th>Status</th></tr></thead><tbody>${appRows}</tbody></table></div>`;
  return s;
}

async function load(){
  try{ if(!DATA){ const r=await fetch(API_BASE+"/dashboard"); DATA=await r.json(); } render(); }
  catch(e){ document.getElementById('content').innerHTML='<div class="note">Backend se connect nahi ho paya (GET '+API_BASE+'/dashboard). Demo file me data embedded hota hai.</div>'; }
}
load();
</script>
